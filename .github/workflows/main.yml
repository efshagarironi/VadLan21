      void fAskKidName(final int k, String initial) {
       final EditText et = new EditText(this);
       et.setSingleLine(true);
       et.setText(initial);
       et.setSelection(initial.length());
       FrameLayout fl = new FrameLayout(this);
       fl.setPadding(dp(20), dp(8), dp(20), 0);
       fl.addView(et, new FrameLayout.LayoutParams(-1, -2));
       new AlertDialog.Builder(this).setTitle(t("تغییر نام", "Rename")).setView(fl)
         .setPositiveButton(t("تأیید", "OK"), (d, w) -> {
          final String nm = et.getText().toString().trim();
          fEdit(l -> { if (k < l.size()) l.get(k).name = nm; });
          show();
         }).setNegativeButton(t("لغو", "Cancel"), null).show();
      }

      void fKidClick(final int k) {
       if (selMode) { selToggle(k); show(); return; }
       final List<BubbleActs.Act> ks = fKids();
       if (k >= ks.size()) return;
       final BubbleActs.Act x = ks.get(k);
       if (BubbleActs.isFolder(x)) {
        int[] np = Arrays.copyOf(fPath, fPath.length + 1);
        np[fPath.length] = k;
        fPath = np;
        show();
        return;
       }
       CharSequence[] items = {
         t("🗗 باز شدن در پاپ آپ", "🗗 Open in a popup"),
         t("⛶ باز شدن کامل", "⛶ Open full"),
         t("تغییر نام", "Rename"),
         t("حذف", "Delete")};
       new AlertDialog.Builder(this).setTitle(BubbleActs.title(this, x)).setItems(items, (d, w) -> {
        if (w == 0 || w == 1) {
         final String win = w == 0 ? "popup" : "full";
         fEdit(l -> { if (k < l.size()) l.get(k).id = win; });
         show();
        } else if (w == 2) {
         fAskKidName(k, BubbleActs.title(this, x));
        } else {
         fEdit(l -> { if (k < l.size()) l.remove(k); });
         show();
        }
       }).setNegativeButton(t("لغو", "Cancel"), null).show();
      }

      View folderEditPage(final int fg) {
       selCheck();
       final BubbleActs.Act root = fRoot();
       LinearLayout r = vbox();
       BubbleActs.Act cur = root == null ? null : BubbleActs.folderAt(root, fPath);
       String title;
       if (cur == null) title = t("پوشه", "Folder");
       else if (fSrc < 0 && fPath.length == 0) title = swArrow(fDir) + "  " + t("ثبت عملکرد", "Record action");
       else title = BubbleActs.title(this, cur);
       r.addView(topBar(title, fg));
       r.addView(pageHint(fg, t("برای جابه‌جایی، هر مورد را یک ثانیه نگه دارید و بکشید. با + برنامه یا پوشه جدید اضافه کنید (حداکثر ۳۰ مورد). پوشه‌ها را هم می‌توانید باز کنید و داخلشان مورد بگذارید.",
         "To move an item, hold it for one second and drag. Use + to add apps or folders (up to 30). Folders can be opened and filled too.")));
       List<BubbleActs.Act> kids = fKids();
       if (selMode && !selIdx.isEmpty()) {
        final int fi = selIdx.iterator().next();
        List<BubbleActs.Act> fks = fKids();
        r.addView(selBar(fg, () -> selDeleteKids(), selIdx.size() == 1 && fi < fks.size() && BubbleActs.isFolder(fks.get(fi)),
          () -> leverSelected(fi, true), () -> leverSelected(fi, false), () -> pinSelected(fi)));
       }
       final float oldFade = boxFade;
       boxFade = 0.6f;
       final List<View> rows = new ArrayList<>();
       for (int i = 0; i < kids.size(); i++) {
        final int k = i;
        final BubbleActs.Act x = kids.get(i);
        final boolean isF = BubbleActs.isFolder(x);
        String sub = isF
          ? t("پوشه", "Folder") + "  •  " + BubbleActs.kids(x).size() + " / " + BubbleActs.FMAX
          : winText(x.id) + "  •  " + BubbleActs.appLabel(this, x.pkg);
        View rv = row(isF ? 0xFFFFC107 : 0xFF26A69A, isF ? "📁" : "✓",
          (i + 1) + ". " + BubbleActs.title(this, x), sub, 0, fg, v -> fKidClick(k));
        r.addView(rv);
        rows.add(rv);
       }
       if (kids.size() < BubbleActs.FMAX && !selMode) {
        r.addView(row(0xFF9E9E9E, "+", t("افزودن", "Add"), kids.size() + " / " + BubbleActs.FMAX, 0, fg,
          v -> fAddChooser()));
       }
       boxFade = oldFade;
       boolean[] cm = new boolean[rows.size()];
       Arrays.fill(cm, true);
       attachReorder(rows, cm, (from, to) -> {
        fEdit(ks -> {
         if (from >= ks.size() || to >= ks.size()) return;
         BubbleActs.Act m = ks.remove(from);
         ks.add(to, m);
        });
        show();
       });
       return wrapScrollKeep(r);
      }

      interface Mv { void go(int from, int to); }

      int keepScrollY = -1;

      ScrollView wrapScrollKeep(View content) {
       final ScrollView sv = wrapScroll(content);
       if (keepScrollY >= 0) {
        final int y = keepScrollY;
        keepScrollY = -1;
        sv.getViewTreeObserver().addOnPreDrawListener(new ViewTreeObserver.OnPreDrawListener() {
         @Override
         public boolean onPreDraw() {
          sv.getViewTreeObserver().removeOnPreDrawListener(this);
          sv.scrollTo(0, y);
          return true;
         }
        });
       }
       return sv;
      }

      void attachReorder(List<View> rows, boolean[] canMove, Mv mv) {
       for (int i = 0; i < rows.size(); i++) {
        if (canMove[i]) rows.get(i).setOnTouchListener(new Reorder(rows, i, mv));
       }
      }

      class Reorder implements View.OnTouchListener {
       final List<View> rows;
       final int idx;
       final Mv mv;
       boolean drag;
       float downX, downY, lastY, grab;
       int cur;
       int[] tops, hs;
       ScrollView sv;
       final Runnable hold = new Runnable() {
        @Override
        public void run() { begin(); }
       };
       final Runnable scroller = new Runnable() {
        @Override
        public void run() {
         if (!drag || sv == null) return;
         int[] sl = new int[2];
         sv.getLocationOnScreen(sl);
         float y = lastY - sl[1];
         int step = 0;
         if (y < dp(90)) step = -dp(10);
         else if (y > sv.getHeight() - dp(90)) step = dp(10);
         if (step != 0) {
          int before = sv.getScrollY();
          sv.scrollBy(0, step);
          if (sv.getScrollY() != before) update();
         }
         sv.postDelayed(this, 16);
        }
       };

       Reorder(List<View> rows, int idx, Mv mv) {
        this.rows = rows;
        this.idx = idx;
        this.mv = mv;
       }

       float pitch(int k) { return k + 1 < tops.length ? tops[k + 1] - tops[k] : hs[k] + dp(10); }

       void begin() {
        View v = rows.get(idx);
        drag = true;
        try { v.getParent().requestDisallowInterceptTouchEvent(true); } catch (Throwable e) { }
        v.setPressed(false);
        v.cancelLongPress();
        v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS);
        int n = rows.size();
        tops = new int[n];
        hs = new int[n];
        for (int k = 0; k < n; k++) {
         tops[k] = rows.get(k).getTop();
         hs[k] = rows.get(k).getHeight();
        }
        cur = idx;
        ViewParent p = v.getParent();
        while (p != null && !(p instanceof ScrollView)) p = p.getParent();
        sv = (ScrollView) p;
        int[] pl = new int[2];
        ((View) v.getParent()).getLocationOnScreen(pl);
        grab = (lastY - pl[1]) - tops[idx];
        v.setScaleX(1.03f);
        v.setScaleY(1.03f);
        v.setTranslationZ(dp(10));
        v.setAlpha(0.92f);
        if (sv != null) sv.post(scroller);
       }

       void update() {
        View v = rows.get(idx);
        int[] pl = new int[2];
        ((View) v.getParent()).getLocationOnScreen(pl);
        float ty = (lastY - pl[1]) - grab - tops[idx];
        v.setTranslationY(ty);
        float center = tops[idx] + ty + hs[idx] / 2f;
        int to = rows.size() - 1;
        for (int k = 0; k < rows.size(); k++) {
         if (center < tops[k] + hs[k]) { to = k; break; }
        }
        if (to != cur) {
         cur = to;
         float foot = pitch(idx);
         for (int k = 0; k < rows.size(); k++) {
          if (k == idx) continue;
          float off = 0;
          if (idx < cur && k > idx && k <= cur) off = -foot;
          else if (idx > cur && k >= cur && k < idx) off = foot;
          rows.get(k).animate().translationY(off).setDuration(140).start();
         }
        }
       }

       void finish(boolean ok) {
        drag = false;
        final View v = rows.get(idx);
        if (sv != null) sv.removeCallbacks(scroller);
        final int from = idx, to = cur;
        if (ok && to != from) {
         float fin = tops[to] - tops[from];
         if (from < to) fin += pitch(to) - pitch(from);
         v.animate().translationY(fin).setDuration(120).withEndAction(() -> {
          keepScrollY = sv != null ? sv.getScrollY() : -1;
          mv.go(from, to);
         }).start();
        } else {
         v.animate().translationY(0).scaleX(1f).scaleY(1f).alpha(1f).translationZ(0).setDuration(140).start();
         for (View o : rows) if (o != v) o.animate().translationY(0).setDuration(140).start();
         if (ok && to == from && selHook != null) selHook.accept(from);
         v.setPressed(false);
        }
       }

       @Override
       public boolean onTouch(View v, MotionEvent ev) {
        switch (ev.getActionMasked()) {
         case MotionEvent.ACTION_DOWN:
          drag = false;
          downX = ev.getRawX();
          downY = ev.getRawY();
          lastY = downY;
          v.postDelayed(hold, 1000);
          return false;
         case MotionEvent.ACTION_MOVE:
          lastY = ev.getRawY();
          if (drag) { update(); return true; }
          if (Math.abs(ev.getRawX() - downX) > dp(10) || Math.abs(ev.getRawY() - downY) > dp(10)) v.removeCallbacks(hold);
          return false;
         case MotionEvent.ACTION_UP:
         case MotionEvent.ACTION_CANCEL:
          v.removeCallbacks(hold);
          if (drag) {
           finish(ev.getActionMasked() == MotionEvent.ACTION_UP);
           return true;
          }
          return false;
        }
        return false;
       }
      }


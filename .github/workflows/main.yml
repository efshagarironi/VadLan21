      private void refresh() {
       if (adapter == null) return;
       List<Vault.Item> all = Vault.snapshot();
       shown.clear();
       String q = query.trim().toLowerCase();
       Set<Long> ids = new HashSet<>();
       for (Vault.Item it : all) {
        ids.add(it.id);
        if (onlyPinned && !it.pin) continue;
        if (!q.isEmpty() && !it.text.toLowerCase().contains(q)) continue;
        shown.add(it);
       }
       boolean had = !sel.isEmpty();
       sel.retainAll(ids);
       adapter.notifyDataSetChanged();
       boolean empty = shown.isEmpty();
       emptyTv.setVisibility(empty ? View.VISIBLE : View.GONE);
       if (empty) {
        if (!q.isEmpty()) emptyTv.setText(t("موردی پیدا نشد", "Nothing found"));
        else if (onlyPinned) emptyTv.setText(t("هنوز موردی سنجاق نشده است", "No pinned items yet"));
        else emptyTv.setText(t("مخزن خالی است؛ یک متن یا لینک کپی کنید", "The vault is empty; copy a text or a link"));
       }
       updateCount();
       if (had && sel.isEmpty()) buildHeader();
      }

      private void onSelChanged() {
       buildHeader();
       adapter.notifyDataSetChanged();
      }

      private void selectAll() {
       boolean all = !shown.isEmpty();
       for (Vault.Item it : shown) if (!sel.contains(it.id)) { all = false; break; }
       if (all) {
        for (Vault.Item it : shown) sel.remove(it.id);
       } else {
        for (Vault.Item it : shown) sel.add(it.id);
       }
       onSelChanged();
      }

      private class RowAdapter extends BaseAdapter {
       @Override public int getCount() { return shown.size(); }
       @Override public Object getItem(int i) { return shown.get(i); }
       @Override public long getItemId(int i) { return shown.get(i).id; }

       @Override
       public View getView(int pos, View cv, ViewGroup parent) {
        Row r;
        if (cv == null) {
         r = new Row();
         cv = r.build();
         cv.setTag(r);
        } else {
         r = (Row) cv.getTag();
        }
        r.bind(shown.get(pos));
        return cv;
       }
      }

      private class Row {
       LinearLayout rootV;
       CheckBox cb;
       TextView ico, txt, sub, cpy, more;
       Vault.Item item;

       View build() {
        rootV = new LinearLayout(ctx);
        rootV.setOrientation(LinearLayout.HORIZONTAL);
        rootV.setGravity(Gravity.CENTER_VERTICAL);
        rootV.setPadding(dp(8), dp(10), dp(6), dp(10));
        rootV.setMinimumHeight(dp(64));
        cb = new CheckBox(ctx);
        cb.setFocusable(false);
        cb.setFocusableInTouchMode(false);
        cb.setOnClickListener(v -> {
         if (item == null) return;
         if (cb.isChecked()) sel.add(item.id); else sel.remove(item.id);
         onSelChanged();
        });
        rootV.addView(cb, lpm(WRAP, WRAP, 0));
        ico = tv("", 18, 0xFF2A2F4A, false);
        ico.setGravity(Gravity.CENTER);
        LinearLayout.LayoutParams ip = lpm(dp(40), dp(40), 0);
        ip.setMargins(dp(4), 0, dp(10), 0);
        rootV.addView(ico, ip);
        LinearLayout colm = new LinearLayout(ctx);
        colm.setOrientation(LinearLayout.VERTICAL);
        txt = tv("", 14, 0xFF1B1F3B, false);
        txt.setSingleLine(true);
        txt.setEllipsize(TextUtils.TruncateAt.END);
        txt.setTextDirection(View.TEXT_DIRECTION_FIRST_STRONG);
        sub = tv("", 11, 0xFF8A90AA, false);
        sub.setSingleLine(true);
        colm.addView(txt, lpm(MATCH, WRAP, 0));
        colm.addView(sub, lpm(MATCH, WRAP, 0));
        rootV.addView(colm, lpm(0, WRAP, 1f));
        cpy = tv("\u29C9", 19, accent, true);
        cpy.setGravity(Gravity.CENTER);
        cpy.setOnClickListener(v -> { if (item != null) copyText(item.text); });
        rootV.addView(cpy, lpm(dp(38), dp(38), 0));
        more = tv("\u22EE", 20, 0xFF4A5070, true);
        more.setGravity(Gravity.CENTER);
        more.setOnClickListener(v -> { if (item != null) rowMenu(item, v); });
        rootV.addView(more, lpm(dp(34), dp(38), 0));
        rootV.setOnClickListener(v -> { if (item != null) copyText(item.text); });
        rootV.setOnLongClickListener(v -> {
         if (item != null) { v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS); onRowLong(item, v); }
         return true;
        });
        return rootV;
       }

       void bind(Vault.Item it) {
        item = it;
        boolean on = sel.contains(it.id);
        cb.setButtonTintList(ColorStateList.valueOf(accent));
        cb.setChecked(on);
        cpy.setTextColor(accent);
        rootV.setBackgroundColor(on ? tint(accent, 0x1E) : 0);
        int bg;
        if (it.pin) bg = 0xFFEDE7F6;
        else if (it.kind == Vault.K_LINK) bg = 0xFFE0F2FE;
        else if (it.kind == Vault.K_NUM) bg = 0xFFE8F5E9;
        else bg = 0xFFE3EDFF;
        ico.setBackground(rr(bg, 12));
        ico.setText(kindGlyph(it));
        txt.setText(preview(it.text, 140));
        sub.setText(ago(it.time));
       }
      }

      private void copyText(String text) {
       try {
        ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
        Vault.selfCopy = text.trim();
        Vault.selfAt = SystemClock.uptimeMillis();
        cm.setPrimaryClip(ClipData.newPlainText("vault", text));
        Toast.makeText(ctx, t("کپی شد", "Copied"), Toast.LENGTH_SHORT).show();
       } catch (Throwable e) { }
       dismiss(true);
      }

      private void copySelected() {
       if (sel.isEmpty()) return;
       StringBuilder b = new StringBuilder();
       for (Vault.Item it : Vault.snapshot()) {
        if (!sel.contains(it.id)) continue;
        if (b.length() > 0) b.append('\n');
        b.append(it.text);
       }
       copyText(b.toString());
      }

      private void deleteSelected() {
       if (sel.isEmpty()) return;
       int n = sel.size();
       Vault.delete(ctx, new HashSet<>(sel));
       sel.clear();
       refresh();
       buildHeader();
       Toast.makeText(ctx, fd(n) + t(" مورد حذف شد", " deleted"), Toast.LENGTH_SHORT).show();
      }

      private void deleteOne(Vault.Item it) {
       Set<Long> one = new HashSet<>();
       one.add(it.id);
       Vault.delete(ctx, one);
       sel.remove(it.id);
       refresh();
      }

      private void pinToggle(Vault.Item it) {
       Vault.togglePin(ctx, it.id);
       refresh();
      }

      private void onRowLong(final Vault.Item it, View anchor) {
       if (it.kind == Vault.K_TEXT) {
        openDetail(it);
        return;
       }
       String label = it.kind == Vault.K_LINK ? t("انتخاب و کپی لینک", "Select and copy link")
         : t("انتخاب و کپی شماره", "Select and copy number");
       showMenu(anchor, new String[]{label, t("نمایش کامل", "Show in full")},
         new Runnable[]{() -> copyText(it.text), () -> openDetail(it)});
      }

      private void rowMenu(final Vault.Item it, View anchor) {
       showMenu(anchor, new String[]{t("نمایش کامل", "Show in full"), t("کپی", "Copy"),
           it.pin ? t("برداشتن سنجاق", "Unpin") : t("سنجاق", "Pin"), t("حذف", "Delete")},
         new Runnable[]{() -> openDetail(it), () -> copyText(it.text), () -> pinToggle(it), () -> deleteOne(it)});
      }

      private void showMenu(View anchor, String[] labels, final Runnable[] acts) {
       closeMenu();
       if (root == null) return;
       menuLayer = new FrameLayout(ctx);
       menuLayer.setClickable(true);
       menuLayer.setOnClickListener(v -> closeMenu());
       LinearLayout card = new LinearLayout(ctx);
       card.setOrientation(LinearLayout.VERTICAL);
       GradientDrawable cg = rr(0xFFFFFFFF, 14);
       cg.setStroke(dp(1), 0x26000000);
       card.setBackground(cg);
       card.setPadding(dp(4), dp(4), dp(4), dp(4));
       for (int i = 0; i < labels.length; i++) {
        TextView it = tv(labels[i], 14, 0xFF1B1F3B, false);
        it.setPadding(dp(16), dp(12), dp(16), dp(12));
        final int k = i;
        it.setOnClickListener(v -> { closeMenu(); acts[k].run(); });
        card.addView(it, lpm(WRAP, WRAP, 0));
       }
       card.measure(View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED),
         View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED));
       int mw = card.getMeasuredWidth(), mh = card.getMeasuredHeight();
       int[] a = new int[2];
       anchor.getLocationInWindow(a);
       int left = clamp(a[0], dp(6), Math.max(dp(6), lp.width - mw - dp(6)));
       int topY = a[1] + anchor.getHeight();
       if (topY + mh > lp.height - dp(6)) topY = Math.max(dp(6), a[1] - mh);
       FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(WRAP, WRAP);
       cp.gravity = Gravity.TOP | Gravity.LEFT;
       cp.leftMargin = left;
       cp.topMargin = topY;
       menuLayer.addView(card, cp);
       root.addView(menuLayer, new FrameLayout.LayoutParams(MATCH, MATCH));
      }

      private void closeMenu() {
       if (menuLayer != null && root != null) {
        try { root.removeView(menuLayer); } catch (Throwable e) { }
       }
       menuLayer = null;
      }

      private void goMain() {
       closeMenu();
       exitKb();
       page = P_MAIN;
       cur = null;
       query = "";
       if (searchEt != null) searchEt.setText("");
       searchBar.setVisibility(View.GONE);
       detailHolder.removeAllViews();
       detailHolder.setVisibility(View.GONE);
       listPane.setVisibility(View.VISIBLE);
       footer.setVisibility(View.VISIBLE);
       buildHeader();
       refresh();
      }

      private void openSearch() {
       closeMenu();
       page = P_SEARCH;
       query = "";
       searchEt.setText("");
       footer.setVisibility(View.GONE);
       searchBar.setVisibility(View.VISIBLE);
       buildHeader();
       refresh();
       enterKb();
       h.postDelayed(() -> { searchEt.requestFocus(); showIme(searchEt); }, 150);
      }

      private void openDetail(Vault.Item it) {
       closeMenu();
       exitKb();
       page = P_DETAIL;
       cur = it;
       listPane.setVisibility(View.GONE);

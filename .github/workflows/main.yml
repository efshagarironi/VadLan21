      void actPickApp(final int slot) {
       multiAppPicker(pkgs -> chooseWin(win -> {
        BubbleActs.Act[] acts = BubbleActs.load(sp);
        List<Integer> empties = new ArrayList<>();
        for (int k = 0; k < acts.length; k++) { int i = (slot + k) % acts.length; if (acts[i] == null) empties.add(i); }
        int e = 0;
        for (String pkg : pkgs) {
         if (e >= empties.size()) break;
         BubbleActs.Act a = new BubbleActs.Act();
         a.pkg = pkg;
         a.type = "app";
         a.id = win;
         a.label = "popup".equals(win) ? t("باز شدن در پاپ آپ", "Open in popup") : t("باز شدن کامل", "Open full");
         a.ts = System.currentTimeMillis();
         acts[empties.get(e++)] = a;
        }
        BubbleActs.save(sp, acts);
        show();
       }));
      }


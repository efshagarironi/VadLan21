       Vault.load(ctx);
       accent = ACC[clamp(sp.getInt("vault_color", 1), 0, 4)];
       alphaPct = clamp(sp.getInt("vault_alpha", 100), 30, 100);
       int wdp = sp.getInt("vault_w", 0), hdp = sp.getInt("vault_h", 0);
       int w = wdp > 0 ? dp(wdp) : Math.min(sw - dp(24), dp(360));
       int hh = hdp > 0 ? dp(hdp) : Math.min((int) (sh * 0.62f), dp(540));
       w = clamp(w, dp(240), sw - dp(8));
       hh = clamp(hh, dp(260), sh - dp(40));
       lp = new WindowManager.LayoutParams(w, hh, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
         WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
           | WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
         PixelFormat.TRANSLUCENT);
       lp.gravity = Gravity.TOP | Gravity.LEFT;
       place(w, hh);
       build();
       wm.addView(root, lp);
       root.setAlpha(0f);
       root.setScaleX(0.92f);
       root.setScaleY(0.92f);
       root.setPivotX(w / 2f);
       root.setPivotY(hh);
       root.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(170).setInterpolator(new DecelerateInterpolator()).start();
      }

      private void place(int w, int hh) {
       int type = sp.getInt("vault_type", 0);
       int margin = dp(8);
       int x, y;
       if (type == 1) {
        x = (sw - w) / 2;
        y = (sh - hh) / 2;
       } else if (sp.getBoolean("vault_auto", false) && sp.getInt("vault_x", -1) >= 0) {
        x = sp.getInt("vault_x", 0);
        y = sp.getInt("vault_y", 0);
       } else {
        x = bx + bsize / 2 - w / 2;
        y = by - hh - dp(10);
        if (y < dp(28)) y = by + bsize + dp(10);
        if (y + hh > sh - dp(8)) y = sh - hh - dp(8);
       }
       lp.x = clamp(x, margin, Math.max(margin, sw - w - margin));
       lp.y = clamp(y, dp(24), Math.max(dp(24), sh - hh - margin));
      }

      boolean isShowing() { return root != null && !closing; }

      void dismiss(boolean anim) {
       if (closing) return;
       closing = true;
       closeMenu();
       h.removeCallbacksAndMessages(null);
       if (focusable) hideIme();
       if (onClosed != null) onClosed.run();
       final Root r = root;
       if (r == null) return;
       final Runnable rm = () -> { try { wm.removeView(r); } catch (Throwable e) { } };
       if (anim) {
        r.animate().alpha(0f).scaleX(0.94f).scaleY(0.94f).setDuration(130).withEndAction(rm).start();
       } else {
        rm.run();
       }
      }

      private void back() {
       if (menuLayer != null) { closeMenu(); return; }
       if (page != P_MAIN) { goMain(); return; }
       dismiss(true);
      }

      private void enterKb() {
       if (focusable || root == null) return;
       focusable = true;
       kbY = lp.y;
       kbH = lp.height;
       lp.flags &= ~WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
       lp.y = dp(24);
       lp.height = Math.min(lp.height, (int) (sh * 0.45f));
       upd();
      }

      private void exitKb() {
       if (!focusable) return;
       hideIme();
       focusable = false;
       lp.flags |= WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
       lp.y = kbY;
       lp.height = kbH;
       upd();
      }

      private void showIme(View v) {
       try {
        InputMethodManager m = (InputMethodManager) ctx.getSystemService(Context.INPUT_METHOD_SERVICE);
        m.showSoftInput(v, InputMethodManager.SHOW_IMPLICIT);
       } catch (Throwable e) { }
      }

      private void hideIme() {
       try {
        InputMethodManager m = (InputMethodManager) ctx.getSystemService(Context.INPUT_METHOD_SERVICE);
        if (root != null) m.hideSoftInputFromWindow(root.getWindowToken(), 0);
       } catch (Throwable e) { }
      }

      private void attachKeyboard(final EditText et) {
       et.setOnTouchListener((v, ev) -> {
        if (ev.getAction() == MotionEvent.ACTION_DOWN && !focusable) {
         enterKb();
         h.postDelayed(() -> { et.requestFocus(); showIme(et); }, 150);
        }
        return false;
       });
      }


      interface KidsOp { void run(List<Act> kids); }

      static boolean edit(Act f, int[] path, int depth, KidsOp op) {
       List<Act> kids = kids(f);
       if (depth == path.length) { op.run(kids); setKids(f, kids); return true; }
       int i = path[depth];
       if (i < 0 || i >= kids.size() || !isFolder(kids.get(i))) return false;
       if (!edit(kids.get(i), path, depth + 1, op)) return false;
       setKids(f, kids);
       return true;
      }

      static Act folderAt(Act root, int[] path) {
       Act cur = root;
       for (int i : path) {
        List<Act> k = kids(cur);
        if (i < 0 || i >= k.size() || !isFolder(k.get(i))) return cur;
        cur = k.get(i);
       }
       return cur;
      }


          t("بدون افکت", "No effect"), t("قطره‌ای (کش‌دار)", "Drop (stretchy)"), t("محو شدن", "Fade"),
          t("کشویی", "Slide from the side"), t("بزرگ شدن از حباب", "Grow from the bubble"),
          t("کرکره‌ای", "Shutter"), t("کشویی از بالا", "Slide from the top"), t("کش افقی", "Horizontal stretch")};
        final int[] fxIds = {0, 6, 1, 2, 3, 4, 5, 7};
        final int[] fxDots = {0xFF9E9E9E, 0xFF29B6F6, 0xFF42A5F5, 0xFF26A69A, 0xFFFF7043, 0xFF8D6E63, 0xFF66BB6A, 0xFFAB47BC};
        r.addView(accordionGroupFaded(0xFF26A69A, "🎞", t("افکت کادر اصلی", "Main box effect"), fg, 0.6f, () -> {
         View[] its = new View[fxNames.length];
         for (int i = 0; i < fxNames.length; i++) {
          final int k = i;
          its[i] = row(fxDots[i], "✦", fxNames[i], null, fx == fxIds[i] ? 1 : 0, fg, v -> {
           sp.edit().putInt("bub_fx", fxIds[k]).apply();
           show();
          });
         }
         return its;
        }));
        r.addView(folderFxGroup(fg));
        r.addView(accordionGroupFaded(0xFF26A69A, "🫧", t("افکت حرکات حباب", "Bubble moves effect"), fg, 0.6f, () -> {
         View[] its = new View[fxNames.length];
         for (int i = 0; i < its.length; i++) {
          final int k = i;
          its[i] = row(fxDots[i], "✦", fxNames[i], null, sp.getInt("bub_fxs", 6) == fxIds[i] ? 1 : 0, fg, v -> {
           sp.edit().putInt("bub_fxs", fxIds[k]).apply();
           show();
          });
         }
         return its;
        }));
        r.addView(accordionRow(0xFFFFB300, "⏱", t("سرعت افکت ها", "Effect speed"), "bub_fxms", 100, 1500, 300, " ms", fg, null));
       }
       return wrapScroll(r);
      }

      final Set<Integer> selIdx = new HashSet<>();
      boolean selMode = false;
      String selKey = "";
      IntConsumer selHook = null;

      String selScope() { return page + "|" + fSrc + "|" + Arrays.toString(fPath) + "|" + fDir + "|" + swDir; }

      void selCheck() {
       String cur = selScope();
       if (!cur.equals(selKey)) { selKey = cur; selIdx.clear(); selMode = false; }
       selHook = i -> { if (selMode) selToggle(i); else { selMode = true; selIdx.add(i); } show(); };
      }

      void selToggle(int i) {
       if (!selIdx.remove(i)) selIdx.add(i);
       if (selIdx.isEmpty()) selMode = false;
      }

      View selBar(final int fg, final Runnable onDelete, final boolean folderSel, final Runnable onHeight, final Runnable onWidth, final Runnable onPin) {
       LinearLayout b = new LinearLayout(this);
       b.setGravity(Gravity.CENTER_VERTICAL);
       b.setPadding(dp(12), dp(6), dp(8), dp(6));
       b.setBackground(boxBg(light() ? 0x14000000 : 0x1AFFFFFF, BOX_R));
       TextView x = new TextView(this);
       x.setText("✕");
       x.setTextSize(18);
       x.setTextColor(fg);
       x.setPadding(dp(4), 0, dp(12), 0);
       x.setOnClickListener(v -> { selIdx.clear(); selMode = false; show(); });
       b.addView(x);
       TextView n = new TextView(this);
       n.setText(t("انتخاب‌شده: ", "Selected: ") + selIdx.size());
       n.setTextColor(fg);
       n.setTextSize(14);
       b.addView(n, new LinearLayout.LayoutParams(0, -2, 1));
       if (folderSel) {
        b.addView(btn(t("ارتفاع", "Height"), fg, v -> onHeight.run()));
        b.addView(btn(t("عرض", "Width"), fg, v -> onWidth.run()));
        b.addView(btn(t("پین", "Pin"), fg, v -> onPin.run()));
       }
       b.addView(btn(t("حذف", "Delete") + " (" + selIdx.size() + ")", 0xFFE53935, v -> onDelete.run()));
       return b;
      }

      void selDeleteKids() {
       final List<Integer> idx = new ArrayList<>(selIdx);
       Collections.sort(idx, Collections.reverseOrder());
       new AlertDialog.Builder(this).setTitle(t("حذف", "Delete"))
         .setMessage(t("موارد انتخاب‌شده حذف شوند؟ پوشه‌ها همراه محتویاتشان حذف می‌شوند.",
           "Delete the selected items? Folders are deleted with what is inside them."))
         .setPositiveButton(t("حذف", "Delete"), (d, w) -> {
          fEdit(l -> { for (int i : idx) if (i < l.size()) l.remove(i); });
          selIdx.clear(); selMode = false;
          show();
         }).setNegativeButton(t("لغو", "Cancel"), null).show();
      }

      void selDeleteSlots() {
       final List<Integer> idx = new ArrayList<>(selIdx);
       new AlertDialog.Builder(this).setTitle(t("حذف", "Delete"))
         .setMessage(t("عملکردهای انتخاب‌شده حذف شوند؟ پوشه‌ها همراه محتویاتشان حذف می‌شوند.",
           "Delete the selected actions? Folders are deleted with what is inside them."))
         .setPositiveButton(t("حذف", "Delete"), (d, w) -> {
          BubbleActs.Act[] acts = BubbleActs.load(sp);
          SharedPreferences.Editor ed = sp.edit();
          for (int i : idx) { acts[i] = null; ed.remove("bub_on_s" + i); }
          ed.apply();
          BubbleActs.save(sp, acts);
          selIdx.clear(); selMode = false;
          show();
         }).setNegativeButton(t("لغو", "Cancel"), null).show();
      }

      View actsPage(final int fg) {
       selCheck();
       LinearLayout r = vbox();
       r.addView(topBar(t("عملکردهای حباب", "Bubble actions"), fg));
       TextView hint = new TextView(this);
       hint.setText(t("هر جایگاه یک عملکرد است: برنامه را انتخاب می‌کنید، یک نام دلخواه می‌دهید و نوع اجرا را برمی‌گزینید (پاپ آپ یا کامل). در لیست حباب با همان نام دلخواه دیده می‌شود.",
         "Each slot is one action: pick an app, give it a custom name and choose how it runs (popup or full). It shows in the bubble list with that name."));
       hint.setTextSize(12);
       hint.setTextColor(fg);
       hint.setAlpha(0.65f);
       hint.setPadding(dp(4), dp(10), dp(4), 0);
       r.addView(hint);
       if (selMode && !selIdx.isEmpty()) {
        final int fi = selIdx.iterator().next();
        r.addView(selBar(fg, () -> selDeleteSlots(), selIdx.size() == 1 && BubbleActs.isFolder(BubbleActs.load(sp)[fi]),
          () -> leverSelected(fi, true), () -> leverSelected(fi, false), () -> pinSelected(fi)));
       }
       final float oldFade = boxFade;
       boxFade = 0.6f; // the slots are secondary (fainter) boxes
       final BubbleActs.Act[] acts = BubbleActs.load(sp);
       for (int i = 0; i < BubbleActs.MAX; i++) {
        final int slot = i;
        BubbleActs.Act a = acts[i];
        if (a == null) {
         r.addView(row(0xFF9E9E9E, "+", (i + 1) + ". " + t("ثبت عملکرد", "Record action"),
           null, 0, fg, v -> actSlotClick(slot)));
        } else {
         String sub = (BubbleActs.isFolder(a) ? t("پوشه", "Folder") + " " + BubbleActs.kids(a).size() + " / " + BubbleActs.FMAX : (a.label == null || a.label.isEmpty() ? a.type : a.label))
           + "  •  " + (BubbleActs.isFolder(a) ? "" : BubbleActs.appLabel(this, a.pkg));
         r.addView(row(BubbleActs.isFolder(a) ? 0xFFFFC107 : 0xFF26A69A, BubbleActs.isFolder(a) ? "📁" : "✓", (i + 1) + ". " + BubbleActs.title(this, a),
           sub, 0, fg, v -> actSlotClick(slot)));
        }
       }
       final List<View> rows = new ArrayList<>();
       boolean[] cm = new boolean[BubbleActs.MAX];
       for (int i = 0; i < BubbleActs.MAX; i++) {
        rows.add(r.getChildAt(r.getChildCount() - BubbleActs.MAX + i));
        cm[i] = acts[i] != null;
       }
       attachReorder(rows, cm, (from, to) -> moveAct(from, to));
       boxFade = oldFade;
       return wrapScrollKeep(r);
      }

      void moveAct(int f, int to) {
       BubbleActs.Act[] a = BubbleActs.load(sp);
       boolean[] on = new boolean[BubbleActs.MAX];
       for (int i = 0; i < BubbleActs.MAX; i++) on[i] = sp.getBoolean("bub_on_s" + i, false);
       BubbleActs.Act x = a[f];
       boolean xo = on[f];
       if (f < to) {
        for (int k = f; k < to; k++) { a[k] = a[k + 1]; on[k] = on[k + 1]; }
       } else {
        for (int k = f; k > to; k--) { a[k] = a[k - 1]; on[k] = on[k - 1]; }
       }
       a[to] = x;
       on[to] = xo;
       BubbleActs.save(sp, a);
       SharedPreferences.Editor ed = sp.edit();
       for (int i = 0; i < BubbleActs.MAX; i++) ed.putBoolean("bub_on_s" + i, on[i]);
       ed.apply();
       show();
      }

      void actSlotClick(final int slot) {
       if (selMode) { if (BubbleActs.load(sp)[slot] != null) selToggle(slot); show(); return; }
       final BubbleActs.Act[] acts = BubbleActs.load(sp);
       final BubbleActs.Act a = acts[slot];
       if (a == null) {
        CharSequence[] add = {
          t("➕ افزودن برنامه", "➕ Add app"),
          t("📁 افزودن پوشه", "📁 Add folder")};
        new AlertDialog.Builder(this).setTitle((slot + 1) + ". " + t("ثبت عملکرد", "Record action"))
          .setItems(add, (d, w) -> {
           if (w == 0) actPickApp(slot);
           else actAskFolderSlot(slot);
          }).setNegativeButton(t("لغو", "Cancel"), null).show();
        return;
       }
       if (BubbleActs.isFolder(a)) {
        CharSequence[] fi = {
          t("📂 باز کردن پوشه", "📂 Open folder"),
          BubbleActs.pinCol(sp, a) > 0 ? t("📍 برداشتن پین", "📍 Unpin") : t("📌 پین کردن", "📌 Pin"),
          t("ارتفاع ستون", "Column height"),
          t("عرض ستون", "Column width"),
          t("تغییر نام", "Rename"),
          t("حذف", "Delete")};
        new AlertDialog.Builder(this).setTitle((slot + 1) + ". " + BubbleActs.title(this, a))
          .setItems(fi, (d, w) -> {
           if (w == 0) { fSrc = slot; fDir = ""; fPath = new int[0]; page = FEDIT; show(); }
           else if (w == 1) {
            if (a.fid == null || a.fid.isEmpty()) { a.fid = BubbleActs.newFid(); BubbleActs.save(sp, acts); }
            pinChooser(a);
           }
           else if (w == 2 || w == 3) {
            if (a.fid == null || a.fid.isEmpty()) { a.fid = BubbleActs.newFid(); BubbleActs.save(sp, acts); }
            colLeverDialog(a, w == 2);
           }
           else if (w == 4) actAskName(slot, "", BubbleActs.title(this, a), BubbleActs.title(this, a), true);
           else { acts[slot] = null; BubbleActs.save(sp, acts); sp.edit().remove("bub_on_s" + slot).apply(); show(); }
          }).setNegativeButton(t("لغو", "Cancel"), null).show();
        return;
       }
       CharSequence[] items = {
         t("باز شدن در پاپ آپ", "Open in popup"),
         t("باز شدن کامل", "Open full"),
         t("تغییر نام", "Rename"),
         t("حذف", "Delete")};
       new AlertDialog.Builder(this).setTitle((slot + 1) + ". " + BubbleActs.title(this, a))
         .setItems(items, (d, w) -> {
          if (w == 0 || w == 1) {
           a.type = "app";
           a.id = w == 0 ? "popup" : "full";
           a.label = w == 0 ? t("باز شدن در پاپ آپ", "Open in popup") : t("باز شدن کامل", "Open full");
           a.ts = System.currentTimeMillis();
           acts[slot] = a;
           BubbleActs.save(sp, acts);
           show();
          } else if (w == 2) {
           actAskName(slot, a.pkg, BubbleActs.appLabel(this, a.pkg), BubbleActs.title(this, a), true);
          } else {
           acts[slot] = null;
           BubbleActs.save(sp, acts);
           sp.edit().remove("bub_on_s" + slot).apply();
           show();
          }
         }).setNegativeButton(t("لغو", "Cancel"), null).show();
      }

      void actAskFolderSlot(final int slot) {
       final EditText et = new EditText(this);
       et.setSingleLine(true);
       et.setHint(t("نام پوشه", "Folder name"));
       FrameLayout fl = new FrameLayout(this);
       fl.setPadding(dp(20), dp(8), dp(20), 0);
       fl.addView(et, new FrameLayout.LayoutParams(-1, -2));
       new AlertDialog.Builder(this).setTitle(t("پوشه جدید", "New folder")).setView(fl)
         .setPositiveButton(t("تأیید", "OK"), (d, w) -> {
          String nm = et.getText().toString().trim();
          if (nm.isEmpty()) nm = t("پوشه", "Folder");
          BubbleActs.Act[] acts = BubbleActs.load(sp);
          acts[slot] = BubbleActs.folder(nm);
          BubbleActs.save(sp, acts);
          fSrc = slot; fDir = ""; fPath = new int[0];
          page = FEDIT;
          show();
         }).setNegativeButton(t("لغو", "Cancel"), null).show();
      }

      BubbleActs.Act fRoot() {
       return fSrc >= 0 ? BubbleActs.load(sp)[fSrc] : BubbleActs.swipeRoot(sp, fDir);
      }

      List<BubbleActs.Act> fKids() {
       BubbleActs.Act r = fRoot();
       return r == null ? new ArrayList<BubbleActs.Act>() : BubbleActs.kids(BubbleActs.folderAt(r, fPath));
      }

      void fEdit(BubbleActs.KidsOp op) {
       BubbleActs.Act r = fRoot();
       if (r == null) return;
       BubbleActs.edit(r, fPath, 0, op);
       if (fSrc >= 0) {
        BubbleActs.Act[] a = BubbleActs.load(sp);
        a[fSrc] = r;
        BubbleActs.save(sp, a);
       } else {
        BubbleActs.swipeRootSave(sp, fDir, r);
       }
      }

      void fAddChooser() {
       CharSequence[] items = {
         t("➕ افزودن برنامه", "➕ Add app"),
         t("📁 افزودن پوشه", "📁 Add folder")};
       new AlertDialog.Builder(this).setTitle(t("افزودن", "Add"))
         .setItems(items, (d, w) -> {
          if (w == 0) fPickApp();
          else fPickFolderName();
         }).setNegativeButton(t("لغو", "Cancel"), null).show();
      }

      void fPickApp() {
       multiAppPicker(pkgs -> chooseWin(win -> {
        fEdit(l -> {
         for (String pkg : pkgs) {
          if (l.size() >= BubbleActs.FMAX) break;
          BubbleActs.Act a = new BubbleActs.Act();
          a.pkg = pkg; a.type = "app"; a.id = win; a.ts = System.currentTimeMillis();
          l.add(a);
         }
        });
        show();
       }));
      }

      void multiAppPicker(final Consumer<List<String>> cb) {
       PackageManager pm = getPackageManager();
       Intent q = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
       Set<String> seen = new HashSet<>();
       final List<String[]> all = new ArrayList<>();
       for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
        String p = ri.activityInfo.packageName;
        if (p.equals(getPackageName()) || !seen.add(p)) continue;
        all.add(new String[]{ri.loadLabel(pm).toString(), p});
       }
       Collections.sort(all, (x, y) -> x[0].compareToIgnoreCase(y[0]));
       final List<String> chosen = new ArrayList<>();
       LinearLayout box = new LinearLayout(this);
       box.setOrientation(LinearLayout.VERTICAL);
       box.setPadding(dp(16), dp(8), dp(16), dp(8));
       final EditText search = new EditText(this);
       search.setSingleLine(true);
       search.setHint(t("جستجوی نام برنامه...", "Search app name..."));
       box.addView(search, new LinearLayout.LayoutParams(-1, -2));
       final TextView count = new TextView(this);
       count.setTextSize(13);
       count.setPadding(0, dp(6), 0, dp(6));
       count.setText(t("انتخاب‌شده: ", "Selected: ") + "0 / " + BubbleActs.FMAX);
       box.addView(count);
       final LinearLayout listBox = new LinearLayout(this);
       listBox.setOrientation(LinearLayout.VERTICAL);
       ScrollView sv = new ScrollView(this);
       sv.addView(listBox);
       box.addView(sv, new LinearLayout.LayoutParams(-1, dp(380)));
       final Runnable render = () -> {
        listBox.removeAllViews();
        String qs = search.getText().toString().trim().toLowerCase();
        for (final String[] ap : all) {
         if (!qs.isEmpty() && !ap[0].toLowerCase().contains(qs)) continue;
         CheckBox cx = new CheckBox(this);
         cx.setText(ap[0]);
         cx.setChecked(chosen.contains(ap[1]));
         cx.setOnCheckedChangeListener((v, on) -> {
          if (on) { if (!chosen.contains(ap[1])) chosen.add(ap[1]); }
          else chosen.remove(ap[1]);
          count.setText(t("انتخاب‌شده: ", "Selected: ") + chosen.size() + " / " + BubbleActs.FMAX);
         });
         listBox.addView(cx);
        }
       };
       search.addTextChangedListener(new TextWatcher() {
        public void beforeTextChanged(CharSequence s, int x, int y, int z) { }
        public void onTextChanged(CharSequence s, int x, int y, int z) { }
        public void afterTextChanged(Editable s) { render.run(); }
       });
       render.run();
       new AlertDialog.Builder(this).setTitle(t("انتخاب برنامه‌ها", "Choose apps")).setView(box)
         .setPositiveButton(t("افزودن", "Add"), (d, w) -> { if (!chosen.isEmpty()) cb.accept(new ArrayList<>(chosen)); })
         .setNegativeButton(t("لغو", "Cancel"), null).show();
      }

      void fPickFolderName() {
       final EditText et = new EditText(this);
       et.setSingleLine(true);
       et.setHint(t("نام پوشه", "Folder name"));
       FrameLayout fl = new FrameLayout(this);
       fl.setPadding(dp(20), dp(8), dp(20), 0);
       fl.addView(et, new FrameLayout.LayoutParams(-1, -2));
       new AlertDialog.Builder(this).setTitle(t("پوشه جدید", "New folder")).setView(fl)
         .setPositiveButton(t("تأیید", "OK"), (d, w) -> {
          String nm = et.getText().toString().trim();
          if (nm.isEmpty()) nm = t("پوشه", "Folder");
          final BubbleActs.Act f = BubbleActs.folder(nm);
          fEdit(l -> { if (l.size() < BubbleActs.FMAX) l.add(f); });

      private boolean isW(char c) {
       return Character.isLetterOrDigit(c) || c == '_' || c == '\u200c';
      }

      private int[] wordRange(String s, int off) {
       int n = s.length();
       if (n == 0) return new int[]{0, 0};
       int i = clamp(off, 0, n - 1);
       if (!isW(s.charAt(i)) && i > 0 && isW(s.charAt(i - 1))) i--;
       if (!isW(s.charAt(i))) return new int[]{i, i + 1};
       int a = i, b = i + 1;
       while (a > 0 && isW(s.charAt(a - 1))) a--;
       while (b < n && isW(s.charAt(b))) b++;
       return new int[]{a, b};
      }

      private int[] tokenAt(String s, int off) {
       Matcher m = TOK.matcher(s);
       while (m.find()) {
        int a = m.start(), b = m.end();
        while (b > a && ".,;:!?)\u060C\u061B".indexOf(s.charAt(b - 1)) >= 0) b--;
        if (off >= a && off <= b && b > a) return new int[]{a, b};
       }
       return null;
      }

      private int offsetAt(TextView tvw, float x, float y) {
       Layout l = tvw.getLayout();
       if (l == null) return 0;
       int yy = (int) y - tvw.getTotalPaddingTop();
       yy = clamp(yy, 0, Math.max(0, l.getHeight() - 1));
       int line = l.getLineForVertical(yy);
       int xx = clamp((int) x - tvw.getTotalPaddingLeft(), 0, tvw.getWidth());
       return l.getOffsetForHorizontal(line, xx);
      }

      private void paintSel(TextView tvw, String full, int s, int e) {
       SpannableString ss = new SpannableString(full);
       if (s >= 0 && e > s) ss.setSpan(new BackgroundColorSpan(tint(accent, 0x66)), s, e, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
       tvw.setText(ss);
      }


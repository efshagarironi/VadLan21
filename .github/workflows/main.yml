     boolean collectFolders(List<BubbleActs.Act> level, String prefix, List<String> labels, List<String> fids) {
      boolean changed = false;
      for (BubbleActs.Act k : level) {
       if (!BubbleActs.isFolder(k)) continue;
       if (k.fid == null || k.fid.isEmpty()) { k.fid = BubbleActs.newFid(); changed = true; }
       String name = prefix + BubbleActs.title(this, k);
       labels.add(name);
       fids.add(k.fid);
       List<BubbleActs.Act> sub = BubbleActs.kids(k);
       if (collectFolders(sub, name + " › ", labels, fids)) { BubbleActs.setKids(k, sub); changed = true; }
      }
      return changed;
     }

     BubbleActs.Act selectedFolder(final int idx) {
      if (page == FEDIT) {
       fEdit(l -> {
        if (idx < l.size() && BubbleActs.isFolder(l.get(idx)) && (l.get(idx).fid == null || l.get(idx).fid.isEmpty()))
         l.get(idx).fid = BubbleActs.newFid();
       });
       List<BubbleActs.Act> ks = fKids();
       return idx < ks.size() && BubbleActs.isFolder(ks.get(idx)) ? ks.get(idx) : null;
      }
      BubbleActs.Act[] acts = BubbleActs.load(sp);
      if (idx < acts.length && BubbleActs.isFolder(acts[idx])) {
       if (acts[idx].fid == null || acts[idx].fid.isEmpty()) { acts[idx].fid = BubbleActs.newFid(); BubbleActs.save(sp, acts); }
       return acts[idx];
      }
      return null;
     }

     void leverSelected(final int idx, final boolean height) {
      BubbleActs.Act f = selectedFolder(idx);
      if (f != null) colLeverDialog(f, height);
     }

     void pinSelected(final int idx) {
      BubbleActs.Act f = selectedFolder(idx);
      if (f != null) pinChooser(f);
     }

     void pinChooser(final BubbleActs.Act f) {
      if (f == null || f.fid == null || f.fid.isEmpty()) return;
      if (BubbleActs.pinCol(sp, f) > 0) {
       BubbleActs.setPin(sp, f.fid, 0);
       Toast.makeText(this, t("پین برداشته شد", "Unpinned"), Toast.LENGTH_SHORT).show();
      } else {
       JSONObject used = BubbleActs.pins(sp);
       int col = 5;
       for (int c = 2; c <= 5; c++) {
        boolean taken = false;
        java.util.Iterator<String> it = used.keys();
        while (it.hasNext()) if (used.optInt(it.next(), 0) == c) { taken = true; break; }
        if (!taken) { col = c; break; }
       }
       BubbleActs.setPin(sp, f.fid, col);
       Toast.makeText(this, t("پوشه پین شد", "Folder pinned"), Toast.LENGTH_SHORT).show();
      }
      show();
     }

     void colLeverDialog(final BubbleActs.Act f, final boolean height) {
      final String key = (height ? "colhu_" : "colwu_") + f.fid;
      LinearLayout box = new LinearLayout(this);
      box.setOrientation(LinearLayout.VERTICAL);
      box.setPadding(dp(20), dp(12), dp(20), dp(8));
      final TextView val = new TextView(this);
      val.setTextSize(16);
      val.setText(sp.getInt(key, 0) + " µm");
      box.addView(val);
      SeekBar sb = new SeekBar(this);
      sb.setMax(40000);
      sb.setProgress(sp.getInt(key, 0) + 20000);
      sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
       public void onProgressChanged(SeekBar bar, int prog, boolean fromUser) {
        int v = prog - 20000;
        sp.edit().putInt(key, v).apply();
        val.setText(v + " µm");
       }
       public void onStartTrackingTouch(SeekBar bar) { }
       public void onStopTrackingTouch(SeekBar bar) { }
      });
      box.addView(sb);
      new AlertDialog.Builder(this)
        .setTitle(height ? t("ارتفاع ستون", "Column height") : t("عرض ستون", "Column width"))
        .setView(box)
        .setPositiveButton(t("تأیید", "OK"), null).show();
     }


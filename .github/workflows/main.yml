      private void attachDrag() {
       final float slop = ViewConfiguration.get(ctx).getScaledTouchSlop();
       header.setOnTouchListener(new View.OnTouchListener() {
        float dx, dy;
        int ox, oy;
        boolean mv;

        @Override
        public boolean onTouch(View v, MotionEvent ev) {
         switch (ev.getActionMasked()) {
          case MotionEvent.ACTION_DOWN:
           dx = ev.getRawX();
           dy = ev.getRawY();
           ox = lp.x;
           oy = lp.y;
           mv = false;
           return true;
          case MotionEvent.ACTION_MOVE: {
           float mx = ev.getRawX() - dx, my = ev.getRawY() - dy;
           if (!mv && Math.hypot(mx, my) > slop) mv = true;
           if (mv) {
            lp.x = clamp(ox + (int) mx, 0, Math.max(0, sw - lp.width));
            lp.y = clamp(oy + (int) my, 0, Math.max(0, sh - lp.height));
            upd();
           }
           return true;
          }
          case MotionEvent.ACTION_UP:
          case MotionEvent.ACTION_CANCEL:
           if (mv && sp.getBoolean("vault_auto", false) && !focusable) {
            sp.edit().putInt("vault_x", lp.x).putInt("vault_y", lp.y).apply();
           }
           return true;
         }
         return false;
        }
       });
      }

      private void buildHeader() {
       header.removeAllViews();
       header.addView(circleBtn("\u2715", 0, 0xFF3A3F5C, 36, v -> dismiss(true)));
       if (page == P_MAIN || page == P_SEARCH) {
        if (!sel.isEmpty()) {
         header.addView(trashPill());
         header.addView(circleBtn("\u29C9", accent, 0xFFFFFFFF, 34, v -> copySelected()));
        }
        header.addView(new View(ctx), lpm(0, 1, 1f));
        if (page == P_MAIN) {
         header.addView(pill(t("سنجاق‌شده", "Pinned"), onlyPinned, v -> { onlyPinned = true; refresh(); buildHeader(); }));
         header.addView(pill(t("همه", "All"), !onlyPinned, v -> { onlyPinned = false; refresh(); buildHeader(); }));
        } else {
         header.addView(circleBtn("\u2190", 0xFFEEF1F8, 0xFF2A2F4A, 34, v -> back()));
        }
       } else {
        String title;
        if (page == P_SET) title = "\u2699  " + t("تنظیمات", "Settings");
        else title = (cur != null ? kindGlyph(cur) + "  " + preview(cur.text, 40) : "");
        TextView tt = tv(title, 15, 0xFF1B1F3B, true);
        tt.setSingleLine(true);
        tt.setEllipsize(TextUtils.TruncateAt.END);
        tt.setGravity(Gravity.CENTER_VERTICAL);
        tt.setPadding(dp(8), 0, dp(8), 0);
        tt.setTextDirection(View.TEXT_DIRECTION_FIRST_STRONG);
        header.addView(tt, lpm(0, WRAP, 1f));
        header.addView(circleBtn("\u2190", 0xFFEEF1F8, 0xFF2A2F4A, 34, v -> back()));
       }
      }


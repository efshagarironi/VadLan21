       startActivity(i);
      }

      private FrameLayout listRoot;      // the list window (null = closed)
      private LinearLayout listCard;
      private WindowManager.LayoutParams listParams;
      private long lastOutside = 0, downAt = 0;

      private boolean fa() { return sp.getString("lang", "fa").equals("fa"); }

      private String tr(String f, String e) { return fa() ? f : e; }

      private void onBubbleTap() {
       if (vaultUI != null) { closeVault(true); return; }
       if (listRoot != null) { closeList(); return; }
       if (Math.abs(downAt - lastOutside) < 250) return;
       boolean lau = sp.getBoolean("bub_launcher", true);
       boolean act = sp.getBoolean("bub_act_on", false);
       boolean has = BubbleActs.pkgs(BubbleActs.load(sp)).size() > 0;
       if (act && has) {
        dropSquash();
        openList(lau);
       } else if (lau) {
        openLauncher(false);
       }
      }

      private ValueAnimator backAnim;

      private final java.util.Map<String, Drawable> svcIcons = new java.util.concurrent.ConcurrentHashMap<>();

      private Drawable svcIcon(String pkg) {
       if (pkg == null) return null;
       Drawable d = svcIcons.get(pkg);
       if (d == null) {
        try { d = getPackageManager().getApplicationIcon(pkg); } catch (Throwable e) { return null; }
        if (d == null) return null;
        svcIcons.put(pkg, d);
       }
       try {
        Drawable.ConstantState cs = d.getConstantState();
        return cs != null ? cs.newDrawable(getResources()).mutate() : d;
       } catch (Throwable e) { return d; }
      }

      private void prewarmSwipe() {
       new Thread(() -> {
        try {
         for (String d : new String[]{"left", "down", "right"}) {
          if ("list".equals(sp.getString("swm_" + d, ""))) warmKids(BubbleActs.kids(BubbleActs.swipeRoot(sp, d)), 0);
         }
        } catch (Throwable e) { }
       }).start();
      }

      private void warmKids(List<BubbleActs.Act> ks, int depth) {
       for (BubbleActs.Act k : ks) {
        if (BubbleActs.isFolder(k)) { if (depth < 3) warmKids(BubbleActs.kids(k), depth + 1); }
        else if (k.pkg != null && !svcIcons.containsKey(k.pkg)) {
         try { svcIcons.put(k.pkg, getPackageManager().getApplicationIcon(k.pkg)); } catch (Throwable e) { }
        }
       }
      }

      private void springBack(final int tx0, final int ty0, final Runnable after) {
       if (params == null || bubbleView == null) return;
       if (backAnim != null) backAnim.cancel();
       final int fx0 = params.x, fy0 = params.y;
       final ValueAnimator an = ValueAnimator.ofFloat(0f, 1f);
       backAnim = an;
       an.setDuration(120);
       an.setInterpolator(new DecelerateInterpolator(1.6f));
       an.addUpdateListener(a -> {
        if (bubbleView == null) return;
        float t = (Float) a.getAnimatedValue();
        params.x = fx0 + Math.round((tx0 - fx0) * t);
        params.y = fy0 + Math.round((ty0 - fy0) * t);
        try { wm.updateViewLayout(bubbleView, params); } catch (Exception e) { }
       });
       an.addListener(new AnimatorListenerAdapter() {
        boolean cancelled;
        @Override
        public void onAnimationCancel(Animator x) { cancelled = true; }
        @Override
        public void onAnimationEnd(Animator x) {
         if (backAnim != an) return;
         backAnim = null;
         if (params != null) { params.x = tx0; params.y = ty0; }
         if (bubbleView != null) {
          try { wm.updateViewLayout(bubbleView, params); } catch (Exception e) { }
         }
         handler.removeCallbacks(collapseRunnable);
         if (listRoot == null) handler.postDelayed(collapseRunnable, collapseDelay());
         if (after != null && !cancelled) after.run();
        }
       });
       an.start();
      }

      private void dropSquash() {
       final View b = bubbleView;
       if (b == null) return;
       b.animate().cancel();
       b.setPivotX(b.getWidth() / 2f);
       b.setPivotY(b.getHeight() / 2f);
       b.animate().scaleX(1.16f).scaleY(0.78f).setDuration(110)
         .withEndAction(() -> b.animate().scaleX(1f).scaleY(1f).setDuration(520)
           .setInterpolator(new OvershootInterpolator(4f)).start()).start();
      }

      private void runSwipe(float dx, float dy) {
       if (Math.abs(dy) >= Math.abs(dx) && dy < 0) {
        openLauncher(false);   // up: the VadLan app itself
        return;
       }
       final String d = Math.abs(dy) >= Math.abs(dx) ? "down" : (dx < 0 ? "left" : "right");
       final boolean fa = fa();
       if ("list".equals(sp.getString("swm_" + d, ""))) {
        List<BubbleActs.Act> kids = BubbleActs.kids(BubbleActs.swipeRoot(sp, d));
        if (!kids.isEmpty()) {
         dropSquash();
         swipeBase = true;
         showKids(kids, null);
         afterBaseOpen(d);
        }
        return;
       }
       String pkg = sp.getString("swipe_" + d, "");
       if (pkg == null || pkg.isEmpty()) return;
       runApp(pkg, "popup".equals(sp.getString("swipe_" + d + "_w", "full")));
      }

      private void showKids(final List<BubbleActs.Act> kids, final Runnable reopenParent) {
       pushKidsPlain(kids, reopenParent, null);
      }

      private void pushKidsPlain(final List<BubbleActs.Act> kids, final Runnable reopenParent, final String key) {
       closeList();
       slideOpen = true;
       openCustomList(kidItems(kids, reopenParent, 0));
       slideOpen = false;
       curKey = key;
      }

      private void folderTap(final BubbleActs.Act k, final int owner, final Runnable reopenThisLevel) {
       final String fk = fkey(k);
       if (!sp.getBoolean("bub_fbox", false) || listRoot == null) {
        pushKidsPlain(BubbleActs.kids(k), reopenThisLevel, fk);
        return;
       }
       final int top = sideBoxes.size();
       final int next = owner + 1;
       if (next <= top) {
        String nk = next < top ? sideBoxes.get(next).key : curKey;
        if (fk.equals(nk)) { while (sideBoxes.size() >= next) closeTopSideAnim(); return; }
        swapFast = true;
        while (sideBoxes.size() >= next) closeTopSideAnim();
        pendingFid = k.fid;
       openSideBox(kidItems(BubbleActs.kids(k), null, next), fk);
        swapFast = false;
        return;
       }
       pendingFid = k.fid;
       openSideBox(kidItems(BubbleActs.kids(k), null, next), fk);
      }

      private List<LItem> kidItems(final List<BubbleActs.Act> kids, final Runnable reopenParent, final int owner) {
       List<LItem> l = new java.util.ArrayList<>();
       if (reopenParent != null && !sp.getBoolean("bub_fbox", false)) {
        LItem back = new LItem();
        back.dot = "⬅";
        back.dotColor = 0xFFFFFFFF;
        back.text = tr("بازگشت", "Back");
        back.click = () -> { closeList(); reopenParent.run(); };
        l.add(back);
       }
       for (final BubbleActs.Act k : kids) {
        if (BubbleActs.pinCol(sp, k) > 0) continue;
        LItem it = new LItem();
        if (BubbleActs.isFolder(k)) {
         it.icon = folderIcon();
         it.text = BubbleActs.title(this, k);
         it.click = () -> folderTap(k, owner, () -> pushKidsPlain(kids, reopenParent, null));
        } else {
         it.pkg = k.pkg;
         it.text = BubbleActs.title(this, k);
         it.click = () -> { closeList(); BubbleActs.run(this, k); };
        }
        l.add(it);
       }
       return l;
      }

      private void runApp(String pkg, boolean popup) {
       if (!BubbleActs.openApp(this, pkg, popup))
        Toast.makeText(this, tr("برنامه پیدا نشد", "App not found"), Toast.LENGTH_SHORT).show();
      }

      private void runAiItem(String d, int id) {
       boolean popup = "popup".equals(BubbleActs.aiWin(sp, d, id));
       if (id == 5) { aiScreen(popup); return; }
       if (!BubbleActs.runAi(this, id, popup))
        Toast.makeText(this, tr("برنامه نصب نیست", "The app is not installed"), Toast.LENGTH_SHORT).show();
      }

      private void aiScreen(final boolean popup) {
       if (getPackageManager().getLaunchIntentForPackage(BubbleActs.GEM) == null) {
        Toast.makeText(this, tr("برنامه نصب نیست", "The app is not installed"), Toast.LENGTH_SHORT).show();
        return;
       }
       if (!TileClickService.ready()) { BubbleActs.needA11y(this); return; }
       if (Build.VERSION.SDK_INT < 30) {
        Toast.makeText(this, tr("تحلیل صفحه به اندروید ۱۱ یا بالاتر نیاز دارد", "Screen analysis needs Android 11 or newer"),
          Toast.LENGTH_SHORT).show();
        BubbleActs.openApp(this, BubbleActs.GEM, popup);
        return;
       }
       if (bubbleView != null) bubbleView.setVisibility(View.INVISIBLE);
       long wait = (sp.getInt("bub_fx", 6) == 0 ? 0 : Math.max(80, Math.min(1500, sp.getInt("bub_fxms", 300)) / 2)) + 250;
       handler.postDelayed(() -> TileClickService.shotAndShare(this, BubbleActs.GEM, popup,
         tr("این صفحه را تحلیل کن", "Analyze this screen"), () -> applyVisibility()), wait);
      }

      private boolean listWithLauncher = false;
      private boolean slideOpen = false;

       static class Box {
        FrameLayout root; LinearLayout card; WindowManager.LayoutParams p; String key; int cx, cy;
        Box(FrameLayout r, LinearLayout c, WindowManager.LayoutParams q, String k) { root = r; card = c; p = q; key = k; }
       }
       private final List<Box> sideBoxes = new java.util.ArrayList<>();
       private Integer forcedX = null, forcedY = null;
       private String curKey = null;
       private int curCX, curCY, lastRowLeft, lastRowRight, lastRowBottom;
       private String pendingFid = null;
       private int umPx(int um) { return (int) android.util.TypedValue.applyDimension(android.util.TypedValue.COMPLEX_UNIT_MM, um / 1000f, getResources().getDisplayMetrics()); }
       private boolean noOpenFx = false;
       private boolean swapFast = false;
       private boolean swipeBase = false;
       private int listTextColor = 0xFFFFFFFF;
       private int lastTouchRawY = 0;

       private boolean autoLight = false;

       private boolean touchOnAnyBox(MotionEvent ev) {
        int x = (int) ev.getRawX(), y = (int) ev.getRawY();
        List<FrameLayout> roots = new ArrayList<>();
        for (Box b : sideBoxes) roots.add(b.root);
        roots.add(listRoot);
        for (FrameLayout r : roots) {
         if (r == null || r.getWidth() == 0) continue;
         int[] l = new int[2];
         r.getLocationOnScreen(l);
         if (x >= l[0] && x <= l[0] + r.getWidth() && y >= l[1] && y <= l[1] + r.getHeight()) return true;
        }
        return false;
       }

       private boolean autoBackLight() { return autoLight; }

       private int boxColorNow() {
        if (!sp.getBoolean("bub_auto", false)) return sp.getInt("bub_lcol", 0xF2202024);
        int al = sp.getInt("bub_auto_alpha", 95) * 255 / 100;
         return (al << 24) | (autoBackLight() ? 0x202024 : 0xF4F4F4);
       }

       private Drawable homeIcon() { return getDrawable(R.drawable.ic_home_app); }

       private static String fkey(BubbleActs.Act k) {
        return (k.name == null ? "" : k.name) + "|" + (k.id == null ? 0 : k.id.hashCode());
       }

       private void afterBaseOpen(final String scope) {
        final FrameLayout base = listRoot;
        if (base == null) return;
        base.post(() -> openPins(scope));
       }

       private void openPins(String scope) {
        List<BubbleActs.Act> level = new ArrayList<>();
        if ("bub_acts".equals(scope)) {
         for (BubbleActs.Act a : BubbleActs.load(sp)) if (a != null) level.add(a);
        } else {
         level = BubbleActs.kids(BubbleActs.swipeRoot(sp, scope));
        }
        List<Object[]> pins = new ArrayList<>();
        gatherPins(level, new ArrayList<BubbleActs.Act>(), pins);
        java.util.Collections.sort(pins, (x, y) -> Integer.compare(BubbleActs.pinCol(sp, (BubbleActs.Act) x[0]), BubbleActs.pinCol(sp, (BubbleActs.Act) y[0])));
        List<BubbleActs.Act> seq = new ArrayList<>();
        java.util.Set<String> done = new java.util.HashSet<>();
        for (Object[] pin : pins) {
         @SuppressWarnings("unchecked")
         List<BubbleActs.Act> chain = (List<BubbleActs.Act>) pin[1];
         for (BubbleActs.Act anc : chain) if (done.add(anc.fid)) seq.add(anc);
         BubbleActs.Act f = (BubbleActs.Act) pin[0];
         if (done.add(f.fid)) seq.add(f);
        }
        final int step = sp.getInt("bub_fxms", 300) + 60;
        for (int idx = 0; idx < seq.size(); idx++) {
         final BubbleActs.Act f = seq.get(idx);
         handler.postDelayed(() -> openOnePin(f), (long) idx * step);
        }
       }

       private void gatherPins(List<BubbleActs.Act> level, List<BubbleActs.Act> chain, List<Object[]> out) {
        for (BubbleActs.Act k : level) {
         if (!BubbleActs.isFolder(k)) continue;
         if (BubbleActs.pinCol(sp, k) > 0) out.add(new Object[]{k, new ArrayList<BubbleActs.Act>(chain)});
         List<BubbleActs.Act> sub = new ArrayList<>(chain);
         sub.add(k);
         gatherPins(BubbleActs.kids(k), sub, out);
        }
       }

       private void openOnePin(BubbleActs.Act f) {
        if (listRoot == null || listParams == null) return;
        int[] tl = new int[2];
        listRoot.getLocationOnScreen(tl);
        lastTouchRawY = tl[1];
        lastRowLeft = tl[0];
        lastRowRight = tl[0] + listRoot.getWidth();
        lastRowBottom = tl[1] + listRoot.getHeight();
        pendingFid = f.fid;
        openSideBox(kidItems(BubbleActs.kids(f), null, sideBoxes.size() + 1), fkey(f));
       }

       private void openSideBox(List<LItem> l, String key) {
      final String fidNow = pendingFid;
      pendingFid = null;
      int gap = dpToPx(3);
      boolean right = sp.getInt("mock_px", 70) > 50;
      int w = listParams.width;
      int sh = getResources().getDisplayMetrics().heightPixels;
      final int cxN = right ? lastRowLeft : lastRowRight, cyN = lastRowBottom;
      forcedX = right ? listParams.x - w - gap : listParams.x + w + gap;
      int y = lastTouchRawY;
      int[] pl = new int[2];
      listRoot.getLocationOnScreen(pl);
      forcedY = lastTouchRawY - (pl[1] - listParams.y);
      if (fidNow != null) {
       forcedX = forcedX + umPx(sp.getInt("colwu_" + fidNow, 0));
       forcedY = forcedY + umPx(sp.getInt("colhu_" + fidNow, 0));
      }
      Box pb = new Box(listRoot, listCard, listParams, curKey);
      pb.cx = curCX; pb.cy = curCY;
      sideBoxes.add(pb);
      listRoot = null;
      listCard = null;
      slideOpen = true;
      noOpenFx = true;
      openCustomList(l);
      noOpenFx = false;
      slideOpen = false;
      curKey = key;
      curCX = cxN; curCY = cyN;
      forcedX = null;
      forcedY = null;
      fxAnim(listRoot, listParams, true, cxN, cyN, lastTouchRawY, sp.getInt("bub_fxf", 0), null);
     }

     private void closeTopSideAnim() {
      if (sideBoxes.isEmpty() || listRoot == null) { closeList(); return; }
      final FrameLayout old = listRoot;
      final WindowManager.LayoutParams op = listParams;
      final int ocx = curCX, ocy = curCY;
      Box b = sideBoxes.remove(sideBoxes.size() - 1);
      listRoot = b.root;
      listCard = b.card;
      listParams = b.p;
      curKey = b.key;
      curCX = b.cx; curCY = b.cy;
      fxAnim(old, op, false, ocx, ocy, ocy, sp.getInt("bub_fxf", 0), () -> { try { wm.removeView(old); } catch (Exception e) { } });
     }

     private void closeTopSide() {
        if (sideBoxes.isEmpty()) { closeList(); return; }
        if (listRoot != null) { try { wm.removeView(listRoot); } catch (Exception e) { } }
        Box b = sideBoxes.remove(sideBoxes.size() - 1);
        listRoot = b.root;
        listCard = b.card;
        listParams = b.p;
        curKey = b.key;
       }

       private Drawable folderIcon() { return getDrawable(R.drawable.ic_folder_app); }

      static class LItem {
       Drawable icon;
       String dot;
       int dotColor;
       String pkg;
       String text;
       Runnable click;
      }

      private List<LItem> customItems = null;

      private void openList(final boolean withLauncher) {
        swipeBase = false;
        if (sp.getBoolean("bub_auto", false) && TileClickService.ready()) {
         TileClickService.sampleLuma(this, lum -> { if (lum < 0) Toast.makeText(this, tr("رنگ زیر کادرها خوانده نشد", "Could not read the colour under the boxes"), Toast.LENGTH_SHORT).show(); autoLight = lum > 128; customItems = null; openListCore(withLauncher); afterBaseOpen("bub_acts"); });
         return;
        }
        if (sp.getBoolean("bub_auto", false)) Toast.makeText(this, tr("برای اتومات، سرویس دسترسی‌پذیری VadLan را روشن کنید", "For auto colours, turn on the VadLan accessibility service"), Toast.LENGTH_LONG).show();
        customItems = null;
        openListCore(withLauncher);
        afterBaseOpen("bub_acts");
       }

      private void openCustomList(List<LItem> items) {
       customItems = items;
       openListCore(false);
      }

      private void openListCore(boolean withLauncher) {
       listWithLauncher = withLauncher;
       listTextColor = sp.getBoolean("bub_fcol_on", false) ? sp.getInt("bub_fcol", 0xFFFFFFFF)
          : ((!sp.getBoolean("bub_auto", false) || autoBackLight()) ? 0xFFFFFFFF : 0xFF111111);
       handler.removeCallbacks(collapseRunnable);
       applyPosition();
       bubbleView.setAlpha(sp.getInt("mock_alpha", 90) / 100f);
       try { wm.updateViewLayout(bubbleView, params); } catch (Exception e) {}

       listRoot = new FrameLayout(this) {
        @Override
        public boolean dispatchTouchEvent(MotionEvent ev) {
         if (ev.getAction() == MotionEvent.ACTION_OUTSIDE) {
         if (touchOnAnyBox(ev)) return true;
          lastOutside = SystemClock.uptimeMillis();
          closeList();
          return true;
         }
         return super.dispatchTouchEvent(ev);
        }
       };
       listRoot.setLayoutDirection(fa() ? View.LAYOUT_DIRECTION_RTL : View.LAYOUT_DIRECTION_LTR);
       final boolean sep = sp.getBoolean("bub_sep", false);
       final boolean glass = sp.getBoolean("bub_lglass", false);
       if (sep) listRoot.setBackgroundColor(0);   // separate boxes: every row has its own background
       else listRoot.setBackground(boxDrawable(boxColorNow(), glass, dpToPx(16)));
       ScrollView sv = new ScrollView(this);
       sv.setVerticalScrollBarEnabled(false);
       listCard = new LinearLayout(this);
       listCard.setOrientation(LinearLayout.VERTICAL);
       int cpad = sep ? 0 : dpToPx(6);
       listCard.setPadding(cpad, cpad, cpad, cpad);
       sv.addView(listCard);
       listRoot.addView(sv, new FrameLayout.LayoutParams(-1, -1));

       listParams = new WindowManager.LayoutParams(
         -2, -2, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
         WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
           | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
           | WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
         PixelFormat.TRANSLUCENT);
       listParams.gravity = Gravity.TOP | Gravity.LEFT;
       if (glass && !sep && Build.VERSION.SDK_INT >= 31) {
        try {
         listParams.flags |= WindowManager.LayoutParams.FLAG_BLUR_BEHIND;
         listParams.setBlurBehindRadius(dpToPx(24));
        } catch (Throwable e) { }
       }
       fillList();
       final int eff = noOpenFx ? sp.getInt("bub_fxf", 0) : (swipeBase ? sp.getInt("bub_fxs", 6) : (slideOpen ? 2 : sp.getInt("bub_fx", 6)));
       if (eff != 0) listRoot.setAlpha(0f);   // the opening effect shows it
       layoutList(true);
       playOpen();
      }

      private void playOpen() {
       final FrameLayout r = listRoot;
       final int fx = noOpenFx ? 0 : (swipeBase ? sp.getInt("bub_fxs", 6) : (slideOpen ? 2 : sp.getInt("bub_fx", 6)));
       if (r == null || fx == 0) return;
       if (fx == 2 || fx == 4 || fx == 7) { final int[] bp = bubblePivot(); fxAnim(r, listParams, true, bp[0], bp[1], Integer.MIN_VALUE, fx, null); return; }
       final long ms = Math.max(100, Math.min(1500, sp.getInt("bub_fxms", 300)));
       final boolean right = sp.getInt("mock_px", 70) > 50;
       r.post(() -> {
        if (listRoot != r) return;
        int w = Math.max(1, r.getWidth()), h = Math.max(1, r.getHeight());
        ViewPropertyAnimator an = r.animate().setDuration(ms);
        if (fx == 2) {
         r.setTranslationX((right ? 1 : -1) * (w + dpToPx(16)));
         r.setAlpha(1f);
         an.translationX(0).setInterpolator(new DecelerateInterpolator(2f));
        } else if (fx == 3) {
         r.setPivotX(right ? w : 0);
         r.setPivotY(0);
         r.setScaleX(0.1f);
         r.setScaleY(0.1f);
         an.scaleX(1f).scaleY(1f).alpha(1f).setInterpolator(new DecelerateInterpolator());
        } else if (fx == 6) {
         float bubCx = params.x + params.width / 2f;
         float px = Math.max(0f, Math.min(w, bubCx - listParams.x));
         boolean above = listParams.y < params.y;
         r.setPivotX(px);
         r.setPivotY(above ? h : 0);
         r.setScaleX(0.3f);
         r.setScaleY(0.05f);
         r.setAlpha(1f);
         ValueAnimator va = ValueAnimator.ofFloat(0f, 1f);
         va.setDuration(Math.max(450, ms * 2));
         va.addUpdateListener(a -> {
          if (listRoot != r) return;
          float t = (Float) a.getAnimatedValue();
          float e = 1f - (float) Math.pow(1f - t, 3);
          float y = 1f - (float) (Math.exp(-5f * t) * Math.cos(9f * t));
          y = Math.max(0.05f, y);
          float x = (0.3f + 0.7f * e) - 0.6f * Math.max(0f, y - 1f);
          r.setScaleX(Math.max(0.2f, x));
          r.setScaleY(y);
         });
         va.addListener(new AnimatorListenerAdapter() {
          @Override
          public void onAnimationEnd(Animator an2) {
           r.setScaleX(1f);
           r.setScaleY(1f);
          }
         });
         va.start();
         return;
        } else if (fx == 5) {
         r.setTranslationY(-(h + dpToPx(24)));
         r.setAlpha(1f);
         an.translationY(0).setInterpolator(new DecelerateInterpolator(2f));
        } else {
         an.alpha(1f);
        }
        an.start();
       });
      }

      private int[] bubblePivot() {
        if (params == null) return new int[]{0, 0};
        return new int[]{params.x + params.width / 2, params.y + params.height / 2};
       }

       private void fxAnim(final FrameLayout r, final WindowManager.LayoutParams p, final boolean open, final int px, final int py, final int folderTop, final int fx, final Runnable end) {
        final long ms = swapFast ? 130 : Math.max(100, Math.min(1500, sp.getInt("bub_fxms", 300)));
        final int w = Math.max(1, p.width), h = Math.max(1, p.height);
        final int ex = p.x, ey = p.y;
        final boolean folder = folderTop != Integer.MIN_VALUE;
        final boolean right = sp.getInt("mock_px", 70) > 50;
        r.setPivotX(px - ex);
        r.setPivotY(py - ey);
        if (fx == 0) { r.setAlpha(1f); r.setScaleX(1f); r.setScaleY(1f); if (end != null) end.run(); return; }
        final int x0, y0;
        if (fx == 2 || fx == 5) {
         if (!folder) { x0 = px - w / 2; y0 = py - h / 2; }
         else if (fx == 5) { x0 = ex; y0 = folderTop - h; }
         else { x0 = right ? px : px - w; y0 = py - h; }
        } else { x0 = ex; y0 = ey; }
        ValueAnimator va = ValueAnimator.ofFloat(open ? 0f : 1f, open ? 1f : 0f);
        va.setDuration(open ? ms : Math.max(100, ms - 60));
        va.setInterpolator(open ? new DecelerateInterpolator() : new AccelerateInterpolator());
        va.addUpdateListener(an -> {
         float f = (Float) an.getAnimatedValue();
         float a = Math.min(1f, f * 3f);
         if (fx == 1) r.setAlpha(f);
         else if (fx == 3) { float sc = 0.05f + 0.95f * f; r.setScaleX(sc); r.setScaleY(sc); r.setAlpha(a); }
         else if (fx == 4) { r.setScaleY(0.05f + 0.95f * f); r.setAlpha(a); }
         else if (fx == 6) { r.setScaleX(0.3f + 0.7f * f); r.setScaleY(0.05f + 0.95f * f); r.setAlpha(a); }
         else if (fx == 7) { r.setScaleX(0.05f + 0.95f * f); r.setAlpha(a); }
         else {
          r.setAlpha(a);
          if (fx == 5 && !folder && !open) { float sc = 0.1f + 0.9f * f; r.setScaleX(sc); r.setScaleY(sc); }
          p.x = Math.round(x0 + (ex - x0) * f);
          p.y = Math.round(y0 + (ey - y0) * f);
          try { wm.updateViewLayout(r, p); } catch (Exception e) { }
         }
        });
        va.addListener(new AnimatorListenerAdapter() {
         @Override
         public void onAnimationEnd(Animator an) { if (end != null) end.run(); }
        });
        va.start();
       }

       private void closeList() {
        final int[] bpv = bubblePivot();
        final int mainFx = swipeBase ? sp.getInt("bub_fxs", 6) : sp.getInt("bub_fx", 6);
        final FrameLayout mainRoot = !sideBoxes.isEmpty() ? sideBoxes.get(0).root : listRoot;
        final WindowManager.LayoutParams mainP = !sideBoxes.isEmpty() ? sideBoxes.get(0).p : listParams;
        for (Box b : sideBoxes) { if (b.root != mainRoot) { try { wm.removeView(b.root); } catch (Exception e) { } } }
        if (listRoot != null && listRoot != mainRoot) { try { wm.removeView(listRoot); } catch (Exception e) { } }
        sideBoxes.clear();
        curKey = null;
        listRoot = null;
        listCard = null;
        customItems = null;
        if (mainRoot != null) {
         final FrameLayout closing = mainRoot;
         fxAnim(mainRoot, mainP, false, bpv[0], bpv[1], Integer.MIN_VALUE, mainFx, () -> { try { wm.removeView(closing); } catch (Exception e) { } });
        }
       handler.removeCallbacks(collapseRunnable);
       handler.postDelayed(collapseRunnable, collapseDelay());
      }

      private void layoutList(boolean add) {
       if (listRoot == null || params == null) return;
       int sw = getResources().getDisplayMetrics().widthPixels;
       int sh = getResources().getDisplayMetrics().heightPixels;
       int w = Math.min(dpToPx(Math.max(15, Math.min(200, sp.getInt("bub_lw", 190)))), sw - dpToPx(16));
       listCard.measure(View.MeasureSpec.makeMeasureSpec(w, View.MeasureSpec.EXACTLY),
         View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED));
       final boolean sepL = sp.getBoolean("bub_sep", false);
       int maxH = sepL ? sh : sh * Math.max(20, Math.min(100, sp.getInt("bub_lh", 100))) / 100;
       int h = Math.min(listCard.getMeasuredHeight(), maxH);
       int cnt = Math.max(2, Math.min(20, sp.getInt("bub_cnt", 20)));
       if (listCard.getChildCount() > cnt) {
        int hc = listCard.getPaddingTop() + listCard.getPaddingBottom();
        for (int i = 0; i < cnt; i++) {
         View cv = listCard.getChildAt(i);
         LinearLayout.LayoutParams clp = (LinearLayout.LayoutParams) cv.getLayoutParams();
         hc += cv.getMeasuredHeight() + clp.topMargin + clp.bottomMargin;
        }
        h = Math.min(h, hc);
       }
       int gap = dpToPx(2) - Math.round(params.height * 0.06f), edge = dpToPx(24);
       int y = params.y + params.height + gap;
       int room = sh - y - edge;
       if (room < Math.min(h, dpToPx(160)) && params.y > room) {
        room = params.y - gap - edge;
        h = Math.min(h, room);
        y = params.y - gap - h;
       } else {
        h = Math.min(h, room);
       }
       boolean right = sp.getInt("mock_px", 70) > 50;
       listParams.width = w;
       listParams.height = sepL ? Math.max(1, h) : Math.max(dpToPx(60), h);
       listParams.x = right ? sw - w - dpToPx(8) : dpToPx(8);
       listParams.y = Math.max(edge, y);
       if (forcedX != null) listParams.x = Math.max(dpToPx(4), Math.min(sw - w - dpToPx(4), forcedX));
       if (forcedY != null) listParams.y = forcedY;
       try {
        if (add) wm.addView(listRoot, listParams);
        else wm.updateViewLayout(listRoot, listParams);
       } catch (Exception e) {}
      }

      private GradientDrawable boxDrawable(int col, boolean glass, int rPx) {
       GradientDrawable g = new GradientDrawable();
       g.setCornerRadius(rPx);
       g.setColor(col);
       g.setStroke(dpToPx(1), glass ? 0x66FFFFFF : 0x33FFFFFF);
       return g;
      }

      private int gapPx() {
       float um = sp.getInt("bub_gap", 800);
       return (int) android.util.TypedValue.applyDimension(android.util.TypedValue.COMPLEX_UNIT_MM, um / 1000f,
         getResources().getDisplayMetrics());
      }

      private TextView listText(String s, float sp14, int color) {
       TextView tv = new TextView(this);
       tv.setText(s);
       tv.setTextSize(sp14);
       tv.setTextColor(color);
       tv.setSingleLine(true);
       tv.setEllipsize(TextUtils.TruncateAt.END);
       return tv;
      }

      private void addListItem(String dot, int dotColor, String pkg, String text, Runnable click) {
        addListItem(dot, dotColor, pkg, null, text, click);
       }

       private void addListItem(String dot, int dotColor, String pkg, Drawable icon, String text, Runnable click) {
       final boolean sep = sp.getBoolean("bub_sep", false);
       boolean showIco = sp.getBoolean("bub_ico", false) && (pkg != null || icon != null);
       boolean showNm = sp.getBoolean("bub_nm", true) || !showIco;   // the icon and the name are never both off
       int ts = Math.max(10, Math.min(28, sp.getInt("bub_lts", 15)));
       int isz = dpToPx(Math.max(5, Math.min(32, sp.getInt("bub_isz", 20))));
       LinearLayout row = new LinearLayout(this);
       row.setGravity(Gravity.CENTER_VERTICAL);
       if (showIco) row.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);   // the name sits to the right of its icon
       int content = Math.max(showNm ? (int) (dpToPx(ts) * 1.5f) : 0, showIco ? isz + dpToPx(6) : 0);
       int vp = Math.max(dpToPx(6), dpToPx(11) * ts / 15);
       row.setPadding(dpToPx(12), sep ? 0 : vp, dpToPx(12), sep ? 0 : vp);
       int boxH = 0;
       if (sep) {
        int lh = Math.max(20, Math.min(100, sp.getInt("bub_lh", 100)));
        boxH = Math.max(dpToPx(8) + dpToPx(52) * lh / 100, content);
        row.setBackground(boxDrawable(boxColorNow(), sp.getBoolean("bub_lglass", false), dpToPx(14)));
       }
       if (dot != null) {
        TextView d = listText(dot, 12, dotColor);
        LinearLayout.LayoutParams dl = new LinearLayout.LayoutParams(-2, -2);
        dl.setMarginEnd(dpToPx(8));
        row.addView(d, dl);
       }
       if (showIco) {
        ImageView iv = new ImageView(this);
        try { iv.setImageDrawable(icon != null ? icon : svcIcon(pkg)); } catch (Throwable e) { }
        iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
        LinearLayout.LayoutParams il = new LinearLayout.LayoutParams(isz, isz);
        if (showNm) il.setMarginEnd(dpToPx(8));
        row.addView(iv, il);
       }
       if (showNm) {
        TextView nameTv = listText(text, ts, listTextColor);
        if (showIco) nameTv.setTextAlignment(View.TEXT_ALIGNMENT_VIEW_START);
        row.addView(nameTv, new LinearLayout.LayoutParams(0, -2, 1));
       } else {
        row.setGravity(Gravity.CENTER);
       }
       row.setOnTouchListener((v, ev) -> {
        int a = ev.getAction();
        if (a == MotionEvent.ACTION_DOWN) { int[] rl = new int[2]; v.getLocationOnScreen(rl); lastTouchRawY = rl[1]; lastRowLeft = rl[0]; lastRowRight = rl[0] + v.getWidth(); lastRowBottom = rl[1] + v.getHeight(); }
        if (sep) {
         if (a == MotionEvent.ACTION_DOWN) v.setAlpha(0.65f);
         else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) v.setAlpha(1f);
        } else {
         if (a == MotionEvent.ACTION_DOWN) v.setBackgroundColor(0x33FFFFFF);
         else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) v.setBackgroundColor(0);
        }
        return false;
       });
       row.setOnClickListener(v -> click.run());
       LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, sep ? boxH : -2);
       if (sep && listCard.getChildCount() > 0) lp.topMargin = gapPx();
       listCard.addView(row, lp);
      }

      private void fillList() {
       if (listCard == null) return;
       listCard.removeAllViews();
       if (customItems != null) {
        for (LItem it : customItems) addListItem(it.dot, it.dotColor, it.pkg, it.icon, it.text, it.click);
        return;
       }
       final BubbleActs.Act[] all = BubbleActs.load(sp);
       if (listWithLauncher) {
        addListItem(null, 0, null, homeIcon(), "VadLan", () -> {
         closeList();
         openLauncher(false);
        });
       }
       for (int i = 0; i < all.length; i++) {
        final BubbleActs.Act a = all[i];
        if (a == null) continue;
        if (BubbleActs.isFolder(a)) {
         if (BubbleActs.pinCol(sp, a) > 0) continue;
         addListItem(null, 0, null, folderIcon(), BubbleActs.title(this, a),
          () -> folderTap(a, 0, () -> openList(listWithLauncher)));
         continue;
       }
       final int slot = i;
        final boolean tile = "tile".equals(a.type);
        boolean on = tile && sp.getBoolean("bub_on_s" + i, false);
        addListItem(tile ? "●" : null, on ? 0xFF4CAF50 : 0x55FFFFFF, a.pkg, BubbleActs.title(this, a), () -> {
         BubbleActs.Act cur = BubbleActs.load(sp)[slot];
         if (cur != null) {
          if (BubbleActs.run(this, cur)) {
           if ("tile".equals(cur.type))
            sp.edit().putBoolean("bub_on_s" + slot, !sp.getBoolean("bub_on_s" + slot, false)).apply();
          } else if (!"tile".equals(cur.type) && !"macro".equals(cur.type)) {
           Toast.makeText(this, tr("اجرای عملکرد ممکن نشد", "Could not run the action"), Toast.LENGTH_SHORT).show();
          }
         }
         closeList();
        });
       }
      }

      private void createBubble() {
       int size = dpToPx(sp.getInt("mock_size", 56));
       params = new WindowManager.LayoutParams(
         size, size, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
         WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
         PixelFormat.TRANSLUCENT
       );
       params.gravity = Gravity.TOP | Gravity.LEFT;
       applyPosition();

       bubbleView = new View(this) {
        Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
        final int[] cols = {0xFFFBBC00, 0xFFFC9A00, 0xFFFF5608, 0xFFFF2813, 0xFFA41A4A, 0xFF8600B2,
          0xFF3D00A5, 0xFF0044FF, 0xFF0090CC, 0xFF69B030, 0xFFD3EA2B, 0xFFFFFF33};
        @Override
        protected void onDraw(Canvas canvas) {
         float cx = getWidth() / 2f, cy = getHeight() / 2f;
         float R = cx * 0.84f;            // outer radius of the ring
         float st = R * 0.36f;            // thickness of the ring
         float rm = R - st / 2f;          // middle radius
         RectF oval = new RectF(cx - rm, cy - rm, cx + rm, cy + rm);
         paint.setStyle(Paint.Style.STROKE);
         paint.setStrokeCap(Paint.Cap.BUTT);
         paint.setShader(null);
         paint.setStrokeWidth(st);
         paint.setColor(0x33000000);
         canvas.drawCircle(cx + st * 0.1f, cy + st * 0.2f, rm, paint);
         for (int i = 0; i < 12; i++) {
          paint.setColor(cols[i]);
          canvas.drawArc(oval, -105f + i * 30f, 30.5f, false, paint);
         }
         float e = st * 0.3f;
         paint.setStrokeWidth(e);
         paint.setColor(0x44000000);
         canvas.drawCircle(cx, cy, R - e / 2f, paint);
         paint.setColor(0x38000000);
         canvas.drawCircle(cx, cy, R - st + e / 2f, paint);
         paint.setStrokeWidth(st * 0.22f);
         paint.setColor(0x40FFFFFF);
         canvas.drawCircle(cx, cy, rm, paint);
         paint.setStrokeWidth(st);
         paint.setShader(new LinearGradient(cx - R, cy - R, cx + R, cy + R,
           new int[]{0x66FFFFFF, 0x00FFFFFF, 0x00000000, 0x66000000},
           new float[]{0f, 0.4f, 0.6f, 1f}, Shader.TileMode.CLAMP));
         canvas.drawCircle(cx, cy, rm, paint);
         paint.setShader(null);
         float rw = Math.max(1f, st * 0.07f);
         paint.setStrokeWidth(rw);
         paint.setColor(0x55FFFFFF);
         canvas.drawCircle(cx, cy, R - rw / 2f, paint);
         paint.setStyle(Paint.Style.FILL);
        }
       };
       bubbleView.setAlpha(sp.getInt("mock_alpha", 90) / 100f);

       bubbleView.setOnTouchListener(new View.OnTouchListener() {
        int ix, iy;
        float tx, ty, lastDx, lastDy;
        boolean moved, longFired, unlocked, gesture;
        Runnable longRun = new Runnable() {
         @Override
         public void run() {
          if (!moved && !gesture) {
           unlocked = true;
           longFired = true;
           try {
            android.os.Vibrator vb = (android.os.Vibrator) getSystemService(VIBRATOR_SERVICE);
            if (vb != null) vb.vibrate(android.os.VibrationEffect.createOneShot(30,
              android.os.VibrationEffect.DEFAULT_AMPLITUDE));
           } catch (Throwable e) { }
           if (listRoot != null) closeList();
           if (sp.getBoolean("vault_on", false)) openVault();
           bubbleView.animate().scaleX(1.12f).scaleY(1.12f).setDuration(120).start();
          }
         }
        };

        @Override
        public boolean onTouch(View v, MotionEvent ev) {
         switch (ev.getAction()) {
          case MotionEvent.ACTION_DOWN:
           if (backAnim != null) { backAnim.cancel(); backAnim = null; }
           handler.removeCallbacks(collapseRunnable);
           bubbleView.setAlpha(sp.getInt("mock_alpha", 90) / 100f);
           applyPosition();
           try { wm.updateViewLayout(bubbleView, params); } catch (Exception e) {}
           ix = params.x;
           iy = params.y;
           tx = ev.getRawX();
           ty = ev.getRawY();
           moved = false;
           longFired = false;
           unlocked = false;
           gesture = false;
           lastDx = 0;
           lastDy = 0;
           downAt = SystemClock.uptimeMillis();
           handler.postDelayed(longRun, sp.getBoolean("vault_on", false) ? 500 : 1000);
           return true;
          case MotionEvent.ACTION_MOVE:
           float dx = ev.getRawX() - tx, dy = ev.getRawY() - ty;
           lastDx = dx;
           lastDy = dy;
           if (!unlocked && !gesture && (Math.abs(dx) > dpToPx(8) || Math.abs(dy) > dpToPx(8))) {
            gesture = true;
            prewarmSwipe();
            handler.removeCallbacks(longRun);
            if (listRoot != null) closeList();
           }
           if (unlocked && !moved && (Math.abs(dx) > dpToPx(8) || Math.abs(dy) > dpToPx(8))) {
            moved = true;
            if (vaultUI != null) { closeVault(false); handler.removeCallbacks(collapseRunnable); }
            if (listRoot != null) closeList();
           }
           if (moved || gesture) {
            params.x = ix + (int) dx;
            params.y = iy + (int) dy;
            try { wm.updateViewLayout(bubbleView, params); } catch (Exception e) {}
           }
           return true;
          case MotionEvent.ACTION_UP:
          case MotionEvent.ACTION_CANCEL:
           handler.removeCallbacks(longRun);
           if (unlocked) bubbleView.animate().scaleX(1f).scaleY(1f).setDuration(120).start();
           int sw = getResources().getDisplayMetrics().widthPixels;
           int sh = getResources().getDisplayMetrics().heightPixels;
           if (gesture && !moved) {
            final float sdx = lastDx, sdy = lastDy;
            boolean fire = ev.getAction() == MotionEvent.ACTION_UP
              && Math.max(Math.abs(sdx), Math.abs(sdy)) > dpToPx(28);
            springBack(ix, iy, fire ? () -> runSwipe(sdx, sdy) : null);
           } else if (moved) {
            int px = (int) (params.x * 100f / Math.max(1, sw - params.width));
            int py = (int) (params.y * 100f / Math.max(1, sh - params.height));
            px = Math.max(0, Math.min(100, px));
            py = Math.max(0, Math.min(100, py));
            sp.edit().putInt("mock_px", px).putInt("mock_py", py).apply();
           } else if (!longFired && ev.getAction() == MotionEvent.ACTION_UP) {
            onBubbleTap();
           }
           if (listRoot == null) handler.postDelayed(collapseRunnable, collapseDelay());
           return true;
         }
         return false;
        }
       });

       try {
        wm.addView(bubbleView, params);
        applyVisibility();
        handler.postDelayed(collapseRunnable, collapseDelay());
       } catch (Exception e) {}
      }

      private VaultUI vaultUI;
      private View magnetView;
      private ClipboardManager clipMgr;
      private long lastClipAt = 0;
      private View grabView;
      private boolean grabGotFocus = false;

      private final ClipboardManager.OnPrimaryClipChangedListener clipListener = new ClipboardManager.OnPrimaryClipChangedListener() {
       @Override
       public void onPrimaryClipChanged() { onClipChanged(); }
      };

      private final Runnable grabTimeout = new Runnable() {
       @Override
       public void run() {
        dropGrab();
        if (!grabGotFocus) startGrabActivity();
       }
      };

      static void magnet() {
       final MockBubbleService s = inst;
       if (s != null) s.handler.post(() -> s.playMagnet());
      }

      private void startClipWatch() {
       try {
        clipMgr = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
        clipMgr.addPrimaryClipChangedListener(clipListener);
       } catch (Throwable e) { }
      }

      private void stopClipWatch() {
       try { if (clipMgr != null) clipMgr.removePrimaryClipChangedListener(clipListener); } catch (Throwable e) { }
       dropGrab();
      }

      private void onClipChanged() {
       if (!sp.getBoolean("vault_on", false)) return;
       long now = SystemClock.uptimeMillis();
       if (now - Vault.selfAt < 1500) return;      // the vault itself copied this
       if (now - lastClipAt < 80) return;
       lastClipAt = now;
       String t = Vault.readClip(this);
       if ((t == null || t.isEmpty()) && TileClickService.inst != null) t = Vault.readClip(TileClickService.inst);
       if (t != null) {
        if (!t.isEmpty()) Vault.capture(this, t);
        return;
       }
       if (TileClickService.inst != null) return;
       if (Vault.captureSelected(this)) return;
       grabWithFocus();
      }

      private void grabWithFocus() {
       if (grabView != null || wm == null) return;
       try {
        grabGotFocus = false;
        View v = new View(this) {
         @Override
         public void onWindowFocusChanged(boolean f) {
          super.onWindowFocusChanged(f);
          if (f && grabView == this) {
           grabGotFocus = true;
           handler.post(() -> {
            String t = Vault.readClip(MockBubbleService.this);
            dropGrab();
            if (t != null) Vault.capture(MockBubbleService.this, t);
            else startGrabActivity();
           });
          }
         }
        };
        WindowManager.LayoutParams gp = new WindowManager.LayoutParams(1, 1,
          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
          PixelFormat.TRANSLUCENT);
        gp.gravity = Gravity.TOP | Gravity.LEFT;
        grabView = v;
        wm.addView(v, gp);
        handler.postDelayed(grabTimeout, 1000);
       } catch (Throwable e) {
        grabView = null;
       }
      }

      private void dropGrab() {
       handler.removeCallbacks(grabTimeout);
       if (grabView != null) {
        try { wm.removeView(grabView); } catch (Throwable e) { }
        grabView = null;
       }
      }

      private void startGrabActivity() {
       try {
        Intent i = new Intent(this, ClipGrabActivity.class);
        i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION | Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS);
        startActivity(i);
       } catch (Throwable e) { }
      }

      private void openVault() {
       if (vaultUI != null || bubbleView == null || params == null) return;
       try {
        if (listRoot != null) closeList();
        handler.removeCallbacks(collapseRunnable);
        bubbleView.setAlpha(sp.getInt("mock_alpha", 90) / 100f);
        vaultUI = new VaultUI(this, wm, sp, params.x, params.y, params.width,
          () -> {
           vaultUI = null;
           if (listRoot == null) {
            handler.removeCallbacks(collapseRunnable);
            handler.postDelayed(collapseRunnable, collapseDelay());
           }
          },
          () -> { lastOutside = SystemClock.uptimeMillis(); });
        vaultUI.show();
       } catch (Throwable e) {
        vaultUI = null;
       }
      }

      private void closeVault(boolean anim) {
       if (vaultUI != null) vaultUI.dismiss(anim);
      }

      private void playMagnet() {
       if (bubbleView == null || params == null || wm == null) return;
       try {
        if (magnetView != null) {
         try { wm.removeView(magnetView); } catch (Throwable e) { }
         magnetView = null;
        }
        boolean folded = bubbleView.getAlpha() < sp.getInt("mock_alpha", 90) / 100f - 0.01f;
        if (folded && listRoot == null && vaultUI == null && backAnim == null) {
         handler.removeCallbacks(collapseRunnable);
         bubbleView.setAlpha(sp.getInt("mock_alpha", 90) / 100f);
         applyPosition();
         try { wm.updateViewLayout(bubbleView, params); } catch (Throwable e) { }
         handler.postDelayed(collapseRunnable, collapseDelay() + 900);
        }
        final VaultUI.MagnetView mv = new VaultUI.MagnetView(this);
        WindowManager.LayoutParams lp = new WindowManager.LayoutParams(params.width, params.height,
          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
            | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
          PixelFormat.TRANSLUCENT);
        lp.gravity = Gravity.TOP | Gravity.LEFT;
        lp.x = params.x;
        lp.y = params.y;
        magnetView = mv;
        wm.addView(mv, lp);
        mv.start(() -> {
         try { wm.removeView(mv); } catch (Throwable e) { }
         if (magnetView == mv) magnetView = null;
        });
       } catch (Throwable e) { }
      }

      private int dpToPx(int dp) {
       return (int) (dp * getResources().getDisplayMetrics().density);
      }

      @Override
      public void onDestroy() {
       super.onDestroy();

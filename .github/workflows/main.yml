     package com.mylauncher;

     import android.app.Activity;
     import android.os.Bundle;

     public class ClipGrabActivity extends Activity {
      private boolean done = false;

      @Override
      protected void onCreate(Bundle b) {
       super.onCreate(b);
       overridePendingTransition(0, 0);
      }

      @Override
      public void onWindowFocusChanged(boolean f) {
       super.onWindowFocusChanged(f);
       if (f && !done) {
        done = true;
        try {
         String t = Vault.readClip(this);
         if (t != null) Vault.capture(this, t);
         else if (!Vault.captureSelected(this)) android.widget.Toast.makeText(this, "Vault: clipboard could not be read", android.widget.Toast.LENGTH_SHORT).show();
        } catch (Throwable e) { }
        finish();
        overridePendingTransition(0, 0);
       }
      }
     }

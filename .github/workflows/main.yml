     public class Vault {
      static final int MAX = 700;
      static final int MAX_LEN = 20000;
      static final int K_TEXT = 0, K_LINK = 1, K_NUM = 2;

      static class Item {
       long id;
       String text;
       long time;
       boolean pin;
       int kind;
      }

      private static final ArrayList<Item> items = new ArrayList<>();   // newest first
      private static boolean loaded = false;
      private static long seq = 0;
      private static final ExecutorService io = Executors.newSingleThreadExecutor();

      static volatile String lastCapText = "";
      static volatile long lastCapAt = 0;

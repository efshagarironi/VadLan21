     cat > app/src/main/java/com/mylauncher/TileClickService.java <<'EOF'
     package com.mylauncher;

     import android.accessibilityservice.AccessibilityService;
     import android.content.ContentValues;
     import android.content.Intent;
     import android.graphics.Bitmap;
     import android.net.Uri;
     import android.os.Build;
     import android.os.Handler;
     import android.os.Looper;
     import android.provider.MediaStore;
     import android.content.SharedPreferences;
     import android.graphics.PixelFormat;
     import android.graphics.drawable.GradientDrawable;
     import android.view.Gravity;
     import android.view.WindowManager;
     import android.view.accessibility.AccessibilityEvent;
     import android.view.accessibility.AccessibilityNodeInfo;
     import android.view.accessibility.AccessibilityWindowInfo;
     import android.widget.TextView;
     import android.widget.Toast;
     import java.io.OutputStream;
     import java.util.ArrayList;
     import java.util.List;
     import org.json.JSONArray;
     import org.json.JSONObject;

     public class TileClickService extends AccessibilityService {
      static TileClickService inst;
      private final Handler h = new Handler(Looper.getMainLooper());
      private String want = "";
      private int tries = 0;
      private boolean busy = false;

      static boolean ready() { return inst != null; }

      static void shotAndShare(final android.content.Context c, final String pkg, final boolean popup,
            final String prompt, final Runnable done) {
       if (inst == null || Build.VERSION.SDK_INT < 30) {
        if (done != null) done.run();
        return;
       }
       try {
        inst.takeScreenshot(android.view.Display.DEFAULT_DISPLAY, c.getMainExecutor(),
          new AccessibilityService.TakeScreenshotCallback() {
         @Override
         public void onSuccess(AccessibilityService.ScreenshotResult r) {
          if (done != null) done.run();
          try {
           Bitmap hw = Bitmap.wrapHardwareBuffer(r.getHardwareBuffer(), r.getColorSpace());
           Bitmap bmp = hw.copy(Bitmap.Config.ARGB_8888, false);
           r.getHardwareBuffer().close();
           ContentValues cv = new ContentValues();
           cv.put(MediaStore.Images.Media.DISPLAY_NAME, "vadlan_screen_" + System.currentTimeMillis() + ".png");
           cv.put(MediaStore.Images.Media.MIME_TYPE, "image/png");
           cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/VadLan");
           Uri u = c.getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv);
           OutputStream os = c.getContentResolver().openOutputStream(u);
           bmp.compress(Bitmap.CompressFormat.PNG, 100, os);
           os.close();
           Intent i = new Intent(Intent.ACTION_SEND).setType("image/png")
             .putExtra(Intent.EXTRA_STREAM, u)
             .putExtra(Intent.EXTRA_TEXT, prompt)
             .setPackage(pkg)
             .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
           if (popup) c.startActivity(i, BubbleActs.popupOpts(c).toBundle());
           else c.startActivity(i);
          } catch (Throwable e) {
           Toast.makeText(c, BubbleActs.fa(c) ? "ارسال تصویر صفحه ممکن نشد" : "Could not send the screenshot",
             Toast.LENGTH_SHORT).show();
          }
         }

         @Override
         public void onFailure(int code) {
          if (done != null) done.run();
          Toast.makeText(c, BubbleActs.fa(c) ? "گرفتن تصویر صفحه ممکن نشد؛ سرویس دسترسی‌پذیری را یک بار خاموش و روشن کنید"
            : "Could not take the screenshot; turn the accessibility service off and on once",
            Toast.LENGTH_LONG).show();
         }
        });
       } catch (Throwable e) {
        if (done != null) done.run();
       }
      }

      static void sampleLuma(final android.content.Context c, final java.util.function.IntConsumer cb) {
       if (inst == null || Build.VERSION.SDK_INT < 30) { cb.accept(-1); return; }
       try {
        inst.takeScreenshot(android.view.Display.DEFAULT_DISPLAY, c.getMainExecutor(),
          new AccessibilityService.TakeScreenshotCallback() {
         @Override
         public void onSuccess(AccessibilityService.ScreenshotResult r) {
          long sum = 0; int n = 0;
          try {
           Bitmap hw = Bitmap.wrapHardwareBuffer(r.getHardwareBuffer(), r.getColorSpace());
           Bitmap bmp = hw.copy(Bitmap.Config.ARGB_8888, false);
           r.getHardwareBuffer().close();
           for (int y = 0; y < bmp.getHeight(); y += 40)
            for (int x = 0; x < bmp.getWidth(); x += 40) {
             int p = bmp.getPixel(x, y);
             sum += (int) (0.299 * android.graphics.Color.red(p) + 0.587 * android.graphics.Color.green(p) + 0.114 * android.graphics.Color.blue(p));
             n++;
            }
          } catch (Throwable e) { n = 0; }
          cb.accept(n > 0 ? (int) (sum / n) : -1);
         }
         @Override
         public void onFailure(int code) { cb.accept(-1); }
        });
       } catch (Throwable e) { cb.accept(-1); }
      }

      static boolean click(String name) {
       if (inst == null || name == null || name.trim().isEmpty()) return false;
       inst.start(name.trim());
       return true;
      }

      @Override
      protected void onServiceConnected() { inst = this; vStart(); }

      private android.content.ClipboardManager vcm;
      private long vLast = 0;
      private final android.content.ClipboardManager.OnPrimaryClipChangedListener vListener =
        new android.content.ClipboardManager.OnPrimaryClipChangedListener() {
         @Override
         public void onPrimaryClipChanged() { vClipChanged(); }
        };

      private void vStart() {
       try {
        if (vcm != null) vcm.removePrimaryClipChangedListener(vListener);
        vcm = (android.content.ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
        vcm.addPrimaryClipChangedListener(vListener);
       } catch (Throwable e) { }
      }

      private void vClipChanged() {
       try {
        SharedPreferences sp = getSharedPreferences("l", 0);
        if (!sp.getBoolean("vault_on", false)) return;
        long now = android.os.SystemClock.uptimeMillis();
        if (now - Vault.selfAt < 1500) return;
        if (now - vLast < 80) return;
        vLast = now;
        String t = Vault.readClip(this);
        if (t != null) {
         if (!t.isEmpty()) Vault.capture(this, t);
         return;
        }
        vOverlayGrab();
       } catch (Throwable e) { }
      }

      void copyHint() {
       try {
        vRetried = false;
        h.postDelayed(new Runnable() {
         @Override
         public void run() { vOverlayGrab(); }
        }, 60);
       } catch (Throwable e) { }
      }

      private android.view.View vGrab;
      private boolean vGot = false;
      private boolean vRetried = false;
      private String vLastText = "";
      private final Runnable vTimeout = new Runnable() {
       @Override
       public void run() {
        boolean got = vGot;
        vDrop();
        if (!got) vActivity();
       }
      };

      private void vDrop() {
       h.removeCallbacks(vTimeout);
       if (vGrab != null) {
        try { ((WindowManager) getSystemService(WINDOW_SERVICE)).removeView(vGrab); } catch (Throwable e) { }
        vGrab = null;
       }
      }

      private void vActivity() {
       try {
        Intent i = new Intent(this, ClipGrabActivity.class);
        i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION | Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS);
        startActivity(i);
       } catch (Throwable e) {
        if (!Vault.captureSelected(this)) Toast.makeText(this, "Vault: cannot open grabber", Toast.LENGTH_SHORT).show();
       }
      }

      private void vOverlayGrab() {
       if (vGrab != null) vDrop();
       try {
        WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
        vGot = false;
        android.view.View v = new android.view.View(this) {
         @Override
         public void onWindowFocusChanged(boolean f) {
          super.onWindowFocusChanged(f);
          if (f && vGrab == this) {
           vGot = true;
           h.post(new Runnable() {
            @Override
            public void run() {
             String t = Vault.readClip(TileClickService.this);
             vDrop();
             if (t != null) {
              if (!t.isEmpty()) {
               boolean same = t.equals(vLastText);

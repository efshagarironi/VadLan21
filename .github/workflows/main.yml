       CharSequence d = n.getContentDescription();
       if (d != null && d.toString().trim().length() > 0) return d.toString().trim();
       if (depth <= 0) return "";
       for (int i = 0; i < n.getChildCount(); i++) {
        String s = labelOf(n.getChild(i), depth - 1);
        if (!s.isEmpty()) return s;
       }
       return "";

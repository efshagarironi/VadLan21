         for (int y = 0; y < h; y += 8) {
          for (int x = 0; x < w; x += 8) {
           int p = bgBmp.getPixel(x, y);
           r += Color.red(p);
           g += Color.green(p);
           b += Color.blue(p);
           n++;
          }
         }
         if (n > 0) c = Color.rgb((int) (r / n), (int) (g / n), (int) (b / n));
        } catch (Throwable e) { }
       }
       return isLight(c) ? 0xB3000000 : 0xB3FFFFFF;
      }


       return c.getSharedPreferences("l", 0).getBoolean("vault_on", false);
      }

      static int kindOf(String t) {
       String s = t.trim();
       if (s.indexOf(' ') < 0 && s.indexOf('\n') < 0) {
        String l = s.toLowerCase();
        if (l.startsWith("http://") || l.startsWith("https://") || l.startsWith("www.") || l.startsWith("ftp://")) return K_LINK;
        try {
         if (android.util.Patterns.WEB_URL.matcher(s).matches()) return K_LINK;
        } catch (Throwable e) { }
       }
       int digits = 0;
       boolean ok = true;
       for (int i = 0; i < s.length() && ok; i++) {
        char c = s.charAt(i);
        if (Character.isDigit(c)) digits++;
        else if ("+-()., /\u066B\u066C\u060C".indexOf(c) < 0) ok = false;
       }
       if (ok && digits >= 1) return K_NUM;
       return K_TEXT;
      }

      static synchronized void load(Context c) {
       if (loaded) return;
       loaded = true;
       try {
        File f = new File(c.getApplicationContext().getFilesDir(), "vault.json");
        if (!f.exists()) return;
        byte[] b = new byte[(int) f.length()];
        FileInputStream in = new FileInputStream(f);
        int off = 0;
        while (off < b.length) {
         int r = in.read(b, off, b.length - off);
         if (r < 0) break;
         off += r;
        }
        in.close();
        JSONArray a = new JSONArray(new String(b, 0, off, "UTF-8"));
        for (int i = 0; i < a.length(); i++) {
         JSONObject o = a.getJSONObject(i);
         Item it = new Item();
         it.id = o.optLong("i");
         it.text = o.optString("t");
         it.time = o.optLong("m");
         it.pin = o.optBoolean("p");
         if (it.text == null || it.text.isEmpty()) continue;
         it.kind = kindOf(it.text);
         items.add(it);
         seq = Math.max(seq, it.id);
        }
       } catch (Throwable e) { }
      }

      private static void saveAsync(Context c) {
       final File dir = c.getApplicationContext().getFilesDir();
       final String json;
       try {
        JSONArray a = new JSONArray();
        for (Item it : items) {
         JSONObject o = new JSONObject();
         o.put("i", it.id);
         o.put("t", it.text);
         o.put("m", it.time);
         o.put("p", it.pin);
         a.put(o);
        }
        json = a.toString();
       } catch (Throwable e) { return; }
       io.execute(() -> {
        try {
         File tmp = new File(dir, "vault.json.tmp");
         FileOutputStream out = new FileOutputStream(tmp);
         out.write(json.getBytes("UTF-8"));
         out.flush();
         out.close();
         File dst = new File(dir, "vault.json");
         if (!tmp.renameTo(dst)) {
          dst.delete();
          tmp.renameTo(dst);
         }
        } catch (Throwable e) { }
       });
      }

      static synchronized List<Item> snapshot() {
       return new ArrayList<>(items);
      }

      static synchronized boolean add(Context c, String raw) {
       load(c);
       if (raw == null) return false;
       String t = raw.trim();
       if (t.isEmpty()) return false;
       if (t.length() > MAX_LEN) t = t.substring(0, MAX_LEN);
       long now = System.currentTimeMillis();
       Item found = null;
       for (Item it : items) {
        if (it.text.equals(t)) { found = it; break; }
       }
       if (found != null) {
        items.remove(found);
        found.time = now;
        items.add(0, found);
       } else {
        Item n = new Item();
        seq = Math.max(seq + 1, now);
        n.id = seq;
        n.text = t;
        n.time = now;
        n.kind = kindOf(t);
        items.add(0, n);
       }
       while (items.size() > MAX) {
        int rm = -1;
        for (int i = items.size() - 1; i >= 0; i--) {
         if (!items.get(i).pin) { rm = i; break; }
        }
        if (rm < 0) rm = items.size() - 1;
        items.remove(rm);
       }
       saveAsync(c);

       LinearLayout.LayoutParams svp = lpm(MATCH, 0, 1f);
       svp.setMargins(dp(10), 0, dp(10), dp(8));
       col.addView(sv, svp);

       final TextView copyBtn = tv(t("کپی", "Copy"), 15, 0xFFFFFFFF, true);
       copyBtn.setGravity(Gravity.CENTER);
       copyBtn.setBackground(rr(accent, 16));
       LinearLayout.LayoutParams cbp = lpm(MATCH, dp(48), 0);
       cbp.setMargins(dp(10), 0, dp(10), dp(8));
       col.addView(copyBtn, cbp);

       LinearLayout ar = new LinearLayout(ctx);
       ar.setOrientation(LinearLayout.HORIZONTAL);
       ar.setPadding(dp(6), 0, dp(6), dp(10));
       final TextView pinB = actionBtn("\uD83D\uDCCC " + (it.pin ? t("برداشتن", "Unpin") : t("سنجاق", "Pin")));
       TextView delB = actionBtn("\uD83D\uDDD1 " + t("حذف", "Delete"));
       TextView allB = actionBtn("\u2611 " + t("انتخاب همه", "Select all"));
       ar.addView(pinB);
       ar.addView(delB);
       ar.addView(allB);
       col.addView(ar, lpm(MATCH, WRAP, 0));

       final int[] selR = {-1, -1};
       final int[] anchor = {0, 0};
       final boolean[] selecting = {false};
       final float[] down = new float[2];
       final long[] downAt = {0};
       final float slop = ViewConfiguration.get(ctx).getScaledTouchSlop();
       final Runnable label = () -> copyBtn.setText(selR[0] >= 0 ? t("کپی بخش انتخاب‌شده", "Copy the selection") : t("کپی", "Copy"));

       final Runnable longRun = () -> {
        int off = offsetAt(txt, down[0], down[1]);
        int[] r = tokenAt(full, off);
        if (r == null) r = wordRange(full, off);
        if (r[1] <= r[0]) return;
        selecting[0] = true;
        anchor[0] = r[0];
        anchor[1] = r[1];
        selR[0] = r[0];
        selR[1] = r[1];
        txt.getParent().requestDisallowInterceptTouchEvent(true);
        txt.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS);
        paintSel(txt, full, selR[0], selR[1]);
        label.run();
       };

       txt.setOnTouchListener((v, ev) -> {
        switch (ev.getActionMasked()) {
         case MotionEvent.ACTION_DOWN:
          down[0] = ev.getX();
          down[1] = ev.getY();
          downAt[0] = SystemClock.uptimeMillis();
          selecting[0] = false;
          h.postDelayed(longRun, 500);
          return true;
         case MotionEvent.ACTION_MOVE:
          if (selecting[0]) {
           int off = offsetAt(txt, ev.getX(), ev.getY());
           int[] w = wordRange(full, off);
           int s = Math.min(anchor[0], w[0]), e = Math.max(anchor[1], w[1]);
           if (s != selR[0] || e != selR[1]) {
            selR[0] = s;
            selR[1] = e;
            paintSel(txt, full, s, e);
           }
           return true;
          }
          if (Math.abs(ev.getX() - down[0]) > slop || Math.abs(ev.getY() - down[1]) > slop) h.removeCallbacks(longRun);
          return true;
         case MotionEvent.ACTION_UP:
          h.removeCallbacks(longRun);
          if (selecting[0]) {
           selecting[0] = false;
          } else if (selR[0] >= 0 && SystemClock.uptimeMillis() - downAt[0] < 300
            && Math.abs(ev.getX() - down[0]) < slop && Math.abs(ev.getY() - down[1]) < slop) {
           selR[0] = -1;
           selR[1] = -1;
           paintSel(txt, full, -1, -1);
           label.run();
          }
          return true;
         case MotionEvent.ACTION_CANCEL:
          h.removeCallbacks(longRun);
          selecting[0] = false;
          return true;
        }
        return false;
       });

       copyBtn.setOnClickListener(v -> copyText(selR[0] >= 0 ? full.substring(selR[0], selR[1]) : full));
       allB.setOnClickListener(v -> {
        selR[0] = 0;
        selR[1] = full.length();
        paintSel(txt, full, 0, full.length());
        label.run();
       });
       pinB.setOnClickListener(v -> {
        Vault.togglePin(ctx, it.id);
        pinB.setText("\uD83D\uDCCC " + (it.pin ? t("برداشتن", "Unpin") : t("سنجاق", "Pin")));
        buildHeader();
       });
       delB.setOnClickListener(v -> { deleteOne(it); goMain(); });
       return col;
      }

